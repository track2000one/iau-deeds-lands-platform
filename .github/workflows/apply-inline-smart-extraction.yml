name: Apply Inline Smart Extraction

on:
  push:
    paths:
      - 'scripts/add-inline-smart-extraction.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply inline smart extraction
        run: node scripts/add-inline-smart-extraction.cjs
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend build
        run: npm run build
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AllocatedLandsPage.tsx \
                  src/app/pages/DeliveredLandsPage.tsx \
                  src/app/pages/LeasedLandsOutPage.tsx \
                  src/app/pages/LeasedLandsInPage.tsx \
                  src/app/pages/LeasedBuildingsOutPage.tsx \
                  src/app/pages/LeasedBuildingsInPage.tsx
          git commit -m "Add smart extraction to inline property forms"
          git push origin HEAD:main
