name: Apply Reference Light Theme

on:
  push:
    paths:
      - 'scripts/apply-reference-light-theme.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply theme patch
        run: node scripts/apply-reference-light-theme.cjs
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend build
        run: npm run build
      - name: Commit generated theme changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/theme/appearanceThemes.ts
          git commit -m "Refine asset theme from light university reference"
          git push origin HEAD:main
