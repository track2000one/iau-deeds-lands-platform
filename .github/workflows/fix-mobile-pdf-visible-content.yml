name: Fix Mobile PDF Visible Content

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-pdf-visible-content.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add html2canvas
        run: npm install html2canvas@1.4.1 --save

      - name: Replace PDF renderer
        run: python3 -c "import base64; exec(base64.b64decode(''))"

      - name: Verify frontend build
        run: npm run build

      - name: Commit fix and cleanup workflow
        shell: bash
        run: |
          rm -f .github/workflows/fix-mobile-pdf-visible-content.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/pages/ReportsPage.tsx package.json package-lock.json .github/workflows/fix-mobile-pdf-visible-content.yml
          git commit -m 'Fix blank Arabic content in downloaded PDF reports'
          git push origin main
