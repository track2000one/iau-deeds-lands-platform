name: Fix Mosques Unit Workflow Polish

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-mosques-unit-polish.cjs'
      - '.github/workflows/fix-mosques-unit-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/fix-mosques-unit-polish.cjs
      - run: npm run build
      - name: Commit workflow polish
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m "Polish mosque request workflow validation"
          git push
