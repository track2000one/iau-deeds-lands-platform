name: Apply Mosque Owner Visit Permissions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-mosque-owner-visit-permissions.py'
      - '.github/workflows/apply-mosque-owner-visit-permissions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply owner-only visit/tour UI policy
        run: python3 scripts/apply-mosque-owner-visit-permissions.py
      - name: Verify frontend build
        run: npm run build
      - name: Commit implementation and cleanup
        run: |
          rm -f scripts/apply-mosque-owner-visit-permissions.py .github/workflows/apply-mosque-owner-visit-permissions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Enforce owner-only mosque visit and tour actions'
          git push
