name: Apply Platform Smart Extraction

on:
  push:
    paths:
      - 'scripts/apply-platform-smart-extraction.cjs'
      - 'scripts/trigger-platform-smart-extraction.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply platform smart extraction patch
        run: node scripts/apply-platform-smart-extraction.cjs
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend build
        run: npm run build
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AddDeedPage.tsx src/app/pages/AddAllocatedLandPage.tsx src/app/pages/AddDeliveredLandPage.tsx src/app/pages/AddLeasedLandOutPage.tsx src/app/pages/AddLeasedLandInPage.tsx src/app/pages/AddLeasedBuildingOutPage.tsx src/app/pages/AddLeasedBuildingInPage.tsx src/app/pages/SiteInspectionFormPage.tsx
          git commit -m "Add smart extraction across platform forms"
          git push origin HEAD:main
