name: Apply Quran Flexible Movement Reports

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-quran-flexible-movement-reports.mjs'
      - '.github/workflows/apply-quran-flexible-movement-reports.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Repair report patch literals
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-quran-flexible-movement-reports.mjs')
          text = path.read_text()
          for token in ('quranNeed', 'sectionsHtml', 'quranAddedInPeriod', 'quranWithdrawnInPeriod'):
              text = text.replace('${' + token + '}', '\\${' + token + '}')
          path.write_text(text)
          PY

      - name: Apply Quran flexible movement reports
        run: node scripts/apply-quran-flexible-movement-reports.mjs

      - name: Normalize generated patch boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          page_path = Path('src/app/pages/MosquesUnitPage.tsx')
          page = page_path.read_text()
          emerald = '            <Card className="overflow-hidden border-emerald-200/80 bg-white/95 shadow-sm">'
          slate = '            <Card className="overflow-hidden border-slate-200 bg-white/95">'
          page = re.sub(re.escape(emerald) + r'\s*' + re.escape(emerald), emerald, page)
          page = re.sub(re.escape(slate) + r'\s*' + re.escape(slate), slate, page)
          page = re.sub(r'\s*<DialogFooter\s*</div>\s*(?=<DialogFooter)', '\n', page)
          page_path.write_text(page)

          reports_path = Path('src/app/components/MosqueReportsCenter.tsx')
          reports = reports_path.read_text()
          building = '    buildings: buildings.map((building, index) => ({ data: {'
          personnel = '    personnel: personnel.map((person, index) => { const site = siteById.get(person.siteId); return ({ data: {'
          reports = re.sub(re.escape(building) + r'\s*' + re.escape(building), building, reports)
          reports = re.sub(re.escape(personnel) + r'\s*' + re.escape(personnel), personnel, reports)
          reports_path.write_text(reports)
          PY

      - name: Verify build
        run: npm run build

      - name: Commit and push changes
        run: |
          if git diff --quiet -- src/app/pages/MosquesUnitPage.tsx src/app/components/MosqueReportsCenter.tsx; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx src/app/components/MosqueReportsCenter.tsx
          git commit -m "Add Quran movement metrics to reports"
          git push origin main
