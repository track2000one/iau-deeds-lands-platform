name: Fix Mosques Mobile Navigation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-mosques-mobile-tabs.py'
      - '.github/workflows/fix-mosques-mobile-tabs.yml'

permissions:
  contents: write

concurrency:
  group: fix-mosques-mobile-tabs
  cancel-in-progress: true

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply mobile navigation fix
        run: python3 scripts/fix-mosques-mobile-tabs.py

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend build
        run: npm run build

      - name: Commit verified frontend source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          if git diff --cached --quiet; then
            echo "No frontend source changes to commit"
            exit 0
          fi
          git commit -m "fix(mosques): improve mobile section navigation"
          git push origin main
