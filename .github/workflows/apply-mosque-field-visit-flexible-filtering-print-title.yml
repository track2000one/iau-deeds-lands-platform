name: Apply Mosque Field Visit Flexible Filtering and Print Title

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-mosque-field-visit-flexible-filtering-print-title.mjs'
      - '.github/workflows/apply-mosque-field-visit-flexible-filtering-print-title.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-mosque-field-visit-flexible-filtering-print-title.mjs
      - run: npm run build
      - name: Commit changes and clean temporary files
        run: |
          rm -f scripts/apply-mosque-field-visit-flexible-filtering-print-title.mjs
          rm -f .github/workflows/apply-mosque-field-visit-flexible-filtering-print-title.yml
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/MosqueFieldVisitsPanel.tsx scripts/apply-mosque-field-visit-flexible-filtering-print-title.mjs .github/workflows/apply-mosque-field-visit-flexible-filtering-print-title.yml
          git commit -m "Add flexible field visit report filtering and title"
          git push
