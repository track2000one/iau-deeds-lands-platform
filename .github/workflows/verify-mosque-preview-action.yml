name: Verify Mosque Preview Action

on:
  push:
    branches: [agent/mosque-preview-action]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mosque-preview-action
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply preview UI patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/app/pages/MosquesUnitPage.tsx')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)

          if 'const [previewSite, setPreviewSite] = useState<MosqueSite | null>(null);' not in text:
              replace_once(
                  "  const [qrSite, setQrSite] = useState<MosqueSite | null>(null);",
                  "  const [previewSite, setPreviewSite] = useState<MosqueSite | null>(null);\n  const [qrSite, setQrSite] = useState<MosqueSite | null>(null);",
                  'preview state',
              )

          if 'onPreview: () => void;' not in text:
              replace_once(
                  "const SiteCard = ({ site, canEdit, canDelete, onEdit, onDelete, onQr }: { site: MosqueSite; canEdit: boolean; canDelete: boolean; onEdit: () => void; onDelete: () => void; onQr: () => void }) =>",
                  "const SiteCard = ({ site, canEdit, canDelete, onPreview, onEdit, onDelete, onQr }: { site: MosqueSite; canEdit: boolean; canDelete: boolean; onPreview: () => void; onEdit: () => void; onDelete: () => void; onQr: () => void }) =>",
                  'SiteCard preview prop',
              )

          preview_button = '<Button variant="outline" className={button3d} onClick={onPreview}><Eye className="ml-1 h-4 w-4" />معاينة</Button>'
          if preview_button not in text:
              replace_once(
                  '}{canEdit && <Button variant="outline" className={button3d} onClick={onEdit}>تعديل</Button>}',
                  '}' + preview_button + '{canEdit && <Button variant="outline" className={button3d} onClick={onEdit}>تعديل</Button>}',
                  'preview button',
              )

          if 'onPreview={() => setPreviewSite(site)}' not in text:
              replace_once(
                  'onEdit={() => openSiteDialog(site)} onDelete={() => deleteSite(site)} onQr={() => setQrSite(site)} />',
                  'onPreview={() => setPreviewSite(site)} onEdit={() => openSiteDialog(site)} onDelete={() => deleteSite(site)} onQr={() => setQrSite(site)} />',
                  'SiteCard preview handler',
              )

          preview_dialog = '''      <Dialog open={Boolean(previewSite)} onOpenChange={(open) => !open && setPreviewSite(null)}>
        <DialogContent dir="rtl" className="sm:max-w-[720px]">
          <DialogHeader>
            <DialogTitle className="flex items-center gap-2"><Eye className="h-5 w-5" />معاينة — {previewSite?.name}</DialogTitle>
            <DialogDescription>عرض بيانات المسجد أو الجامع أو المصلى المسجلة دون الدخول في وضع التعديل.</DialogDescription>
          </DialogHeader>
          {previewSite && <div className="space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3 rounded-2xl border bg-slate-50 p-4">
              <div>
                <p className="text-xs text-muted-foreground">الموقع</p>
                <p className="mt-1 font-black text-slate-800">{[previewSite.campusLocation, previewSite.city, previewSite.district].filter(Boolean).join(' — ') || '-'}</p>
              </div>
              <Badge variant="outline" className={previewSite.status === 'active' ? 'border-emerald-300 bg-emerald-50 text-emerald-700' : previewSite.status === 'maintenance' ? 'border-amber-300 bg-amber-50 text-amber-700' : 'border-slate-300 bg-slate-50'}>{siteStatusLabels[previewSite.status] || previewSite.status}</Badge>
            </div>
            <div className="grid gap-4 rounded-2xl border bg-white p-4 sm:grid-cols-2">
              <Info label="النوع" value={siteTypeLabels[previewSite.siteType] || previewSite.siteType} />
              <Info label="المساحة" value={previewSite.area ? `${previewSite.area.toLocaleString('ar-SA')} م²` : '-'} />
              <Info label="السعة" value={previewSite.capacity ? previewSite.capacity.toLocaleString('ar-SA') : '-'} />
              <Info label="الإمام" value={previewSite.imamName || '-'} />
              <Info label="المؤذن" value={previewSite.muezzinName || '-'} />
              <Info label="الخطيب" value={previewSite.khateebName || '-'} />
              <Info label="رقم التواصل" value={previewSite.contactPhone || '-'} />
              <Info label="الإحداثيات" value={previewSite.latitude != null && previewSite.longitude != null ? `${previewSite.latitude}, ${previewSite.longitude}` : '-'} />
            </div>
            {previewSite.notes && <div className="rounded-2xl border bg-slate-50 p-4"><p className="text-xs text-muted-foreground">ملاحظات</p><p className="mt-2 whitespace-pre-wrap text-sm leading-7 text-slate-700">{previewSite.notes}</p></div>}
            {previewSite.latitude != null && previewSite.longitude != null && <div className="flex justify-end"><Button variant="outline" className={button3d} onClick={() => window.open(`https://www.google.com/maps?q=${previewSite.latitude},${previewSite.longitude}`, '_blank')}><MapPin className="ml-2 h-4 w-4" />فتح الموقع على الخريطة</Button></div>}
          </div>}
        </DialogContent>
      </Dialog>

'''
          if '<Dialog open={Boolean(previewSite)}' not in text:
              replace_once(
                  '      <Dialog open={Boolean(qrSite)} onOpenChange={(open) => !open && setQrSite(null)}>',
                  preview_dialog + '      <Dialog open={Boolean(qrSite)} onOpenChange={(open) => !open && setQrSite(null)}>',
                  'preview dialog',
              )

          path.write_text(text, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run build
      - name: Commit verified UI change
        shell: bash
        run: |
          if git diff --quiet -- src/app/pages/MosquesUnitPage.tsx; then
            echo "No code changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m "feat(mosques): add mosque site preview action"
          git push origin HEAD:agent/mosque-preview-action
