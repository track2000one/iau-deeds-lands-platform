name: Add create-user permission

on:
  push:
    paths:
      - '.github/workflows/add-create-user-permission.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply frontend permission changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:140]!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'src/types/permissions.ts',
              '  canDelete: boolean;\n  canPrint: boolean;\n}',
              '  canDelete: boolean;\n  canPrint: boolean;\n  canCreateUser: boolean;\n}',
          )
          replace_once(
              'src/types/permissions.ts',
              "  canDelete: true,\n  canPrint: true,\n};",
              "  canDelete: true,\n  canPrint: true,\n  canCreateUser: true,\n};",
          )
          replace_once(
              'src/types/permissions.ts',
              "  canDelete: false,\n  canPrint: false,\n};",
              "  canDelete: false,\n  canPrint: false,\n  canCreateUser: false,\n};",
          )
          replace_once(
              'src/types/permissions.ts',
              '      output[moduleName].canDelete ||\n      output[moduleName].canPrint\n',
              '      output[moduleName].canDelete ||\n      output[moduleName].canPrint ||\n      output[moduleName].canCreateUser\n',
          )

          replace_once(
              'src/app/components/PermissionMatrix.tsx',
              "  { key: 'canPrint', ar: 'طباعة', en: 'Print' },\n];",
              "  { key: 'canPrint', ar: 'طباعة', en: 'Print' },\n  { key: 'canCreateUser', ar: 'إضافة مستخدم جديد', en: 'Create User' },\n];",
          )
          replace_once(
              'src/app/components/PermissionMatrix.tsx',
              "        canDelete: false,\n        canPrint: false,\n      };",
              "        canDelete: false,\n        canPrint: false,\n        canCreateUser: false,\n      };",
          )
          replace_once(
              'src/app/components/PermissionMatrix.tsx',
              "          {ui('الأقسام غير المفعلة ستختفي من القائمة الجانبية.', 'Disabled sections will be hidden from the sidebar.')}\n        </p>",
              "          {ui('الأقسام غير المفعلة ستختفي من القائمة الجانبية.', 'Disabled sections will be hidden from the sidebar.')}\n        </p>\n        <p className=\"mt-1 text-xs text-muted-foreground\">\n          {ui('صلاحية «إضافة مستخدم جديد» مخصصة حاليًا لوحدة العناية بالمساجد والمصليات، وتسمح بإنشاء أو ربط حساب المنسوب ضمن نفس عملية إضافته.', 'Create User is currently scoped to the Mosques & Prayer Rooms Care Unit and creates or links the personnel login in the same operation.')}\n        </p>",
          )
          replace_once(
              'src/app/components/PermissionMatrix.tsx',
              '        <table className="w-full min-w-[760px] text-sm">',
              '        <table className="w-full min-w-[900px] text-sm">',
          )
          old_actions = '''                {ACTIONS.map((action) => (\n                  <td key={action.key} className="p-3 text-center">\n                    <Label className="inline-flex cursor-pointer items-center justify-center">\n                      <input\n                        type="checkbox"\n                        className="h-4 w-4"\n                        checked={Boolean(value[moduleName]?.[action.key])}\n                        disabled={disabled}\n                        onChange={(event) =>\n                          setPermission(\n                            moduleName,\n                            action.key,\n                            event.target.checked\n                          )\n                        }\n                      />\n                    </Label>\n                  </td>\n                ))}'''
          new_actions = '''                {ACTIONS.map((action) => {\n                  const supported = action.key !== 'canCreateUser' || moduleName === 'mosques';\n                  return (\n                    <td key={action.key} className="p-3 text-center">\n                      {supported ? (\n                        <Label className="inline-flex cursor-pointer items-center justify-center">\n                          <input\n                            type="checkbox"\n                            className="h-4 w-4"\n                            checked={Boolean(value[moduleName]?.[action.key])}\n                            disabled={disabled}\n                            onChange={(event) =>\n                              setPermission(\n                                moduleName,\n                                action.key,\n                                event.target.checked\n                              )\n                            }\n                          />\n                        </Label>\n                      ) : (\n                        <span className="text-muted-foreground/60" title={ui('غير مطبق لهذا القسم', 'Not applicable to this section')}>—</span>\n                      )}\n                    </td>\n                  );\n                })}'''
          replace_once('src/app/components/PermissionMatrix.tsx', old_actions, new_actions)

          replace_once(
              'src/app/pages/MosquesUnitPage.tsx',
              "  const canPrint = isAdmin || hasPermission('mosques', 'canPrint');\n",
              "  const canPrint = isAdmin || hasPermission('mosques', 'canPrint');\n  const canCreateUser = isAdmin || hasPermission('mosques', 'canCreateUser');\n",
          )
          replace_once(
              'src/app/pages/MosquesUnitPage.tsx',
              "    if (!personnelForm.siteId || !personnelForm.name.trim() || !personnelForm.email.trim()) return toast.error('الموقع والاسم والبريد الإلكتروني مطلوبة');\n    setSaving(true);",
              "    if (!personnelForm.siteId || !personnelForm.name.trim() || !personnelForm.email.trim()) return toast.error('الموقع والاسم والبريد الإلكتروني مطلوبة');\n    if (!editingPersonnel && !canCreateUser) return toast.error('لا تملك صلاحية إضافة مستخدم جديد وربطه بمنسوبي المساجد');\n    setSaving(true);",
          )
          replace_once(
              'src/app/pages/MosquesUnitPage.tsx',
              "            {['head', 'supervisor'].includes(role) && <Button className={`${button3d} bg-sky-700 hover:bg-sky-800`} onClick={() => openSiteDialog()}><Plus className=\"ml-2 h-4 w-4\" />إضافة مسجد / مصلى</Button>}",
              "            {canAdd && ['head', 'supervisor'].includes(role) && <Button className={`${button3d} bg-sky-700 hover:bg-sky-800`} onClick={() => openSiteDialog()}><Plus className=\"ml-2 h-4 w-4\" />إضافة مسجد / مصلى</Button>}",
          )
          replace_once(
              'src/app/pages/MosquesUnitPage.tsx',
              "          {['head', 'supervisor'].includes(role) && <div className=\"flex justify-end\"><Button className={button3d} onClick={() => openPersonnelDialog()}><UserPlus className=\"ml-2 h-4 w-4\" />إضافة منسوب مسجد / جامع / مصلى</Button></div>}",
              "          {canCreateUser && ['head', 'supervisor'].includes(role) && <div className=\"flex justify-end\"><Button className={button3d} onClick={() => openPersonnelDialog()}><UserPlus className=\"ml-2 h-4 w-4\" />إضافة منسوب + حساب دخول</Button></div>}",
          )
          replace_once(
              'src/app/pages/MosquesUnitPage.tsx',
              "<DialogDescription>{editingPersonnel ? 'يمكن للمسؤول تحديث بيانات المنسوب والموقع والصفة التشغيلية، وتنعكس التغييرات على ربط حسابه.' : 'يتم إنشاء أو ربط حساب دخول للمنسوب بواسطة رئيس الوحدة أو المشرف، ثم ربطه بالموقع وصفته التشغيلية.'}</DialogDescription>",
              "<DialogDescription>{editingPersonnel ? 'يمكن للمسؤول تحديث بيانات المنسوب والموقع والصفة التشغيلية، وتنعكس التغييرات على ربط حسابه.' : 'إجراء موحد: إضافة المنسوب وتحديد المسجد والصفة، ثم إنشاء حساب دخول جديد تلقائيًا أو ربط الحساب الموجود وإرسال بيانات التفعيل بالبريد.'}</DialogDescription>",
          )
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build verification
        run: npm run build
      - name: Commit verified changes
        run: |
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/types/permissions.ts src/app/components/PermissionMatrix.tsx src/app/pages/MosquesUnitPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add create-user permission for mosque personnel'
          git push origin main
