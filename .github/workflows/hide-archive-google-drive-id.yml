name: Hide Archive Google Drive ID
on:
  push:
    branches: [main]
    paths:
      - 'scripts/hide-archive-google-drive-id.cjs'
      - '.github/workflows/hide-archive-google-drive-id.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/hide-archive-google-drive-id.cjs
      - run: npm run build
      - name: Commit archive privacy fix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/ArchivePage.tsx
          git commit -m "Hide Google Drive internal ID from archive users"
          git restore --worktree .
          git pull --rebase origin main
          git push origin main
