name: Apply Building Coverage Report Tools

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-building-coverage-report-tools.mjs'
      - '.github/workflows/apply-building-coverage-report-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Apply report tools patch
        run: node scripts/apply-building-coverage-report-tools.mjs
      - name: Verify build
        run: npm run build
      - name: Commit and push changes
        run: |
          if git diff --quiet -- src/app/pages/MosquesUnitPage.tsx; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m 'Add flexible building coverage report controls'
          git push origin main
