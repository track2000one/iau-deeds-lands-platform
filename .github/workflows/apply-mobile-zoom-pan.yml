name: Apply Mobile Zoom Pan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-zoom-pan.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python3 scripts/apply-mobile-zoom-pan.py
      - run: npm ci
      - run: npm run build
      - name: Remove temporary patch files
        run: rm -f scripts/apply-mobile-zoom-pan.py .github/workflows/apply-mobile-zoom-pan.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html src/styles/globals.css scripts/apply-mobile-zoom-pan.py .github/workflows/apply-mobile-zoom-pan.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Allow mobile pinch zoom and horizontal pan"
            git push origin main
          fi
