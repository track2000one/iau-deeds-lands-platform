name: Apply Quran Search Sky Background

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-quran-search-sky-background.mjs'
      - '.github/workflows/apply-quran-search-sky-background.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Apply Quran search background patch
        run: node scripts/apply-quran-search-sky-background.mjs
      - name: Verify build
        run: npm run build
      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m 'Set Quran search field sky blue background'
          git push origin main
