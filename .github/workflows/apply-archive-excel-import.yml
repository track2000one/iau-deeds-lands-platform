name: Apply Archive Excel Import

on:
  push:
    branches: [main]
    paths:
      - 'src/app/components/ArchiveExcelImportDialog.tsx'
      - 'scripts/apply-archive-excel-import.mjs'
      - '.github/workflows/apply-archive-excel-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply archive Excel import patch
        run: node scripts/apply-archive-excel-import.mjs

      - name: Verify build
        run: npm run build

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/ArchivePage.tsx src/app/components/ArchiveExcelImportDialog.tsx
          git commit -m "Add Excel import to archive"
          git push origin main
