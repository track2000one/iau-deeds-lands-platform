name: Apply Larger Sidebar Menu Font

on:
  push:
    paths:
      - '.github/workflows/apply-larger-sidebar-menu-font.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply sidebar font patch
        run: node scripts/apply-larger-sidebar-menu-font.mjs

      - name: Verify build
        run: npm run build

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/Layout.tsx
          git commit -m "Increase sidebar menu font size"
          git push origin main
