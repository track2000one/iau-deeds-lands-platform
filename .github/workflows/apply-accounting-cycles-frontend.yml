name: Apply accounting cycles frontend

on:
  push:
    paths:
      - '.github/workflows/apply-accounting-cycles-frontend.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply frontend patch
        run: python scripts/apply-accounting-cycles-frontend.py
      - name: Verify frontend
        run: |
          npm ci
          npm run build
      - name: Commit integration
        run: |
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/routes.tsx src/app/pages/AccountingTransformationDashboardPage.tsx src/app/pages/AccountingTransformationCyclesPage.tsx src/app/pages/AccountingTransformationImportPage.tsx src/app/pages/AccountingTransformationRecordsPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'fix: polish accounting transformation data cycles UX'
          git push origin main
