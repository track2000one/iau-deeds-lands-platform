name: Fix asset cycles header
on:
  push:
    paths:
      - '.github/workflows/fix-asset-cycles-light-header.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Apply page fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_asset_cycles.py
          python /tmp/patch_asset_cycles.py
      - name: Verify frontend
        run: |
          npm ci
          npm run build
      - name: Commit and remove temporary workflow
        run: |
          rm .github/workflows/fix-asset-cycles-light-header.yml
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/pages/AssetCyclesPage.tsx .github/workflows/fix-asset-cycles-light-header.yml
          git commit -m 'fix: correct asset cycles page contrast'
          git push
