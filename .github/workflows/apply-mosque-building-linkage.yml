name: Apply Mosque Building Linkage UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mosque-building-linkage.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply mosque building linkage UI
        run: node scripts/apply-mosque-building-linkage.mjs
      - name: Verify frontend build
        run: npm run build
      - name: Commit implementation and cleanup
        run: |
          rm -f .github/workflows/apply-mosque-building-linkage.yml scripts/apply-mosque-building-linkage.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/mosques.ts src/app/pages/MosquesUnitPage.tsx .github/workflows/apply-mosque-building-linkage.yml scripts/apply-mosque-building-linkage.mjs
          git commit -m 'Link mosques and prayer rooms to university buildings'
          git push origin main
