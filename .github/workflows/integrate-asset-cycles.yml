name: Integrate asset data cycles frontend

# Temporary helper for wiring the asset cycle pages.
on:
  push:
    paths:
      - '.github/workflows/integrate-asset-cycles.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Wire cycle pages into routes and asset dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          routes = Path('src/app/routes.tsx')
          s = routes.read_text()
          old = "const AssetExcelImportPage = lazy(() => import('./pages/AssetExcelImportPage').then((m) => ({ default: m.AssetExcelImportPage })));"
          new = "const AssetExcelImportPage = lazy(() => import('./pages/AssetCycleImportPage').then((m) => ({ default: m.AssetCycleImportPage })));\nconst AssetCyclesPage = lazy(() => import('./pages/AssetCyclesPage').then((m) => ({ default: m.AssetCyclesPage })));"
          if old not in s:
              raise SystemExit('Asset import lazy marker not found')
          s = s.replace(old, new, 1)
          old = "          { path: 'import', element: assetPermission(<AssetExcelImportPage />, 'canAdd') },\n          { path: 'reports', element: assetPermission(<AssetReportsPage />, 'canView') },"
          new = "          { path: 'import', element: assetPermission(<AssetExcelImportPage />, 'canAdd') },\n          { path: 'cycles', element: assetPermission(<AssetCyclesPage />, 'canView') },\n          { path: 'reports', element: assetPermission(<AssetReportsPage />, 'canView') },"
          if old not in s:
              raise SystemExit('Asset route marker not found')
          s = s.replace(old, new, 1)
          routes.write_text(s)

          dashboard = Path('src/app/pages/AssetDashboardPage.tsx')
          s = dashboard.read_text()
          old = '''  {\n    label: 'استيراد Excel',\n    description: 'رفع بيانات الأصول من النماذج المعتمدة دفعة واحدة.',\n    path: '/assets/import',\n    icon: FileSpreadsheet,\n    ready: true,\n    tone: 'amber',\n  },\n'''
          new = '''  {\n    label: 'دورات تحديث البيانات',\n    description: 'إدارة الإصدارات التاريخية ومقارنة كل تحديث بالدورة السابقة قبل الاعتماد.',\n    path: '/assets/cycles',\n    icon: Database,\n    ready: true,\n    tone: 'cyan',\n  },\n  {\n    label: 'استيراد Excel',\n    description: 'رفع بيانات الأصول داخل دورة مسودة مستقلة للمقارنة والمراجعة قبل الاعتماد.',\n    path: '/assets/import',\n    icon: FileSpreadsheet,\n    ready: true,\n    tone: 'amber',\n  },\n'''
          if old not in s:
              raise SystemExit('Asset quick action marker not found')
          s = s.replace(old, new, 1)
          dashboard.write_text(s)
          PY

      - name: Verify frontend
        run: |
          npm ci
          npm run build

      - name: Commit feature integration and cleanup
        run: |
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/integrate-asset-cycles.yml
          git add src/app/routes.tsx src/app/pages/AssetDashboardPage.tsx src/app/pages/AssetCyclesPage.tsx src/app/pages/AssetCycleImportPage.tsx src/app/api/assetCycles.ts .github/workflows/integrate-asset-cycles.yml
          git commit -m 'feat: add asset data update cycle experience'
          git push origin main
