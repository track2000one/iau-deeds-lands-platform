name: Add Mosque Building Coordinate UI

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-mosque-building-coordinates.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Add building coordinate UI
        run: |
          python3 - <<'PY'
          from pathlib import Path

          api_path = Path('src/app/api/mosques.ts')
          api = api_path.read_text()
          old = "  city?: string | null;\n  district?: string | null;\n  expectedUsers?: number | null;\n"
          new = "  city?: string | null;\n  district?: string | null;\n  latitude?: number | null;\n  longitude?: number | null;\n  expectedUsers?: number | null;\n"
          start = api.find('export type MosqueBuilding = {')
          end = api.find('export type MosqueSite = {', start)
          if start < 0 or end < 0:
              raise SystemExit('MosqueBuilding type not found')
          block = api[start:end]
          if 'latitude?: number | null;' not in block:
              updated = block.replace(old, new, 1)
              if updated == block:
                  raise SystemExit('MosqueBuilding type marker not found')
              api = api[:start] + updated + api[end:]
          api_path.write_text(api)

          page_path = Path('src/app/pages/MosquesUnitPage.tsx')
          s = page_path.read_text()

          old = """const emptyBuilding = {\n  buildingNumber: '', name: '', campusLocation: '', city: 'الدمام', district: '', expectedUsers: '',\n  coverageStatus: 'unassessed', creationFeasibility: 'under_study', unavailableReason: '', approvedAlternative: '', notes: '',\n};"""
          new = """const emptyBuilding = {\n  buildingNumber: '', name: '', campusLocation: '', city: 'الدمام', district: '', latitude: '', longitude: '', expectedUsers: '',\n  coverageStatus: 'unassessed', creationFeasibility: 'under_study', unavailableReason: '', approvedAlternative: '', notes: '',\n};"""
          if "latitude: '', longitude: '', expectedUsers: ''" not in s:
              if old not in s:
                  raise SystemExit('emptyBuilding marker not found')
              s = s.replace(old, new, 1)

          old = """  const [buildingDialog, setBuildingDialog] = useState(false);\n  const [editingBuilding, setEditingBuilding] = useState<MosqueBuilding | null>(null);\n  const [buildingForm, setBuildingForm] = useState<any>(emptyBuilding);\n  const [siteDialog, setSiteDialog] = useState(false);"""
          new = """  const [buildingDialog, setBuildingDialog] = useState(false);\n  const [editingBuilding, setEditingBuilding] = useState<MosqueBuilding | null>(null);\n  const [buildingForm, setBuildingForm] = useState<any>(emptyBuilding);\n  const [showBuildingMap, setShowBuildingMap] = useState(false);\n  const [locatingBuilding, setLocatingBuilding] = useState(false);\n  const [siteDialog, setSiteDialog] = useState(false);"""
          if 'const [showBuildingMap, setShowBuildingMap]' not in s:
              if old not in s:
                  raise SystemExit('building state marker not found')
              s = s.replace(old, new, 1)

          old = """      city: building.city || '',\n      district: building.district || '',\n      expectedUsers: building.expectedUsers ?? '',"""
          new = """      city: building.city || '',\n      district: building.district || '',\n      latitude: building.latitude ?? '',\n      longitude: building.longitude ?? '',\n      expectedUsers: building.expectedUsers ?? '',"""
          if 'latitude: building.latitude ??' not in s:
              if old not in s:
                  raise SystemExit('openBuildingDialog coordinate marker not found')
              s = s.replace(old, new, 1)

          old = """    } : emptyBuilding);\n    setBuildingDialog(true);\n  };\n\n  const saveBuilding = async () => {"""
          helper = """    } : emptyBuilding);\n    setShowBuildingMap(Boolean(building?.latitude != null && building?.longitude != null));\n    setBuildingDialog(true);\n  };\n\n  const buildingPickerCoordinates = useMemo(() => {\n    const latitude = Number(buildingForm.latitude);\n    const longitude = Number(buildingForm.longitude);\n    if (!Number.isFinite(latitude) || !Number.isFinite(longitude)) return undefined;\n    if (latitude < -90 || latitude > 90 || longitude < -180 || longitude > 180) return undefined;\n    return { latitude, longitude };\n  }, [buildingForm.latitude, buildingForm.longitude]);\n\n  const updateBuildingCoordinates = React.useCallback((coordinates: { latitude: number; longitude: number }) => {\n    setBuildingForm((current: any) => ({\n      ...current,\n      latitude: Number(coordinates.latitude.toFixed(6)),\n      longitude: Number(coordinates.longitude.toFixed(6)),\n    }));\n  }, []);\n\n  const captureCurrentBuildingLocation = React.useCallback(() => {\n    if (!navigator.geolocation) {\n      toast.error('المتصفح لا يدعم تحديد الموقع الجغرافي');\n      return;\n    }\n    setLocatingBuilding(true);\n    navigator.geolocation.getCurrentPosition(\n      (position) => {\n        updateBuildingCoordinates({ latitude: position.coords.latitude, longitude: position.coords.longitude });\n        setShowBuildingMap(true);\n        setLocatingBuilding(false);\n        toast.success('تم تحديد موقع المبنى وتعبئة الإحداثيات');\n      },\n      (error) => {\n        setLocatingBuilding(false);\n        toast.error(error.code === error.PERMISSION_DENIED\n          ? 'يرجى السماح للمتصفح باستخدام الموقع الجغرافي ثم إعادة المحاولة'\n          : 'تعذر تحديد الموقع الحالي. تأكد من تفعيل خدمة الموقع في الجهاز');\n      },\n      { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 },\n    );\n  }, [updateBuildingCoordinates]);\n\n  const saveBuilding = async () => {"""
          if 'const buildingPickerCoordinates = useMemo' not in s:
              if old not in s:
                  raise SystemExit('building helper insertion marker not found')
              s = s.replace(old, helper, 1)

          old = """    if (buildingForm.creationFeasibility === 'unavailable' && !String(buildingForm.unavailableReason || '').trim()) {\n      return toast.error('سبب تعذر إنشاء المصلى مطلوب');\n    }\n    setSaving(true);"""
          new = """    if (buildingForm.creationFeasibility === 'unavailable' && !String(buildingForm.unavailableReason || '').trim()) {\n      return toast.error('سبب تعذر إنشاء المصلى مطلوب');\n    }\n    const hasLatitude = String(buildingForm.latitude ?? '').trim() !== '';\n    const hasLongitude = String(buildingForm.longitude ?? '').trim() !== '';\n    if (hasLatitude !== hasLongitude) return toast.error('أدخل خط العرض وخط الطول معًا');\n    if (hasLatitude) {\n      const latitude = Number(buildingForm.latitude);\n      const longitude = Number(buildingForm.longitude);\n      if (!Number.isFinite(latitude) || latitude < -90 || latitude > 90) return toast.error('خط العرض غير صحيح');\n      if (!Number.isFinite(longitude) || longitude < -180 || longitude > 180) return toast.error('خط الطول غير صحيح');\n    }\n    setSaving(true);"""
          if "const hasLatitude = String(buildingForm.latitude" not in s:
              if old not in s:
                  raise SystemExit('saveBuilding validation marker not found')
              s = s.replace(old, new, 1)

          old = """        name: String(buildingForm.name || '').trim() || null,\n        expectedUsers: buildingForm.expectedUsers === '' ? null : Number(buildingForm.expectedUsers),"""
          new = """        name: String(buildingForm.name || '').trim() || null,\n        latitude: String(buildingForm.latitude ?? '').trim() === '' ? null : Number(buildingForm.latitude),\n        longitude: String(buildingForm.longitude ?? '').trim() === '' ? null : Number(buildingForm.longitude),\n        expectedUsers: buildingForm.expectedUsers === '' ? null : Number(buildingForm.expectedUsers),"""
          if "latitude: String(buildingForm.latitude" not in s:
              if old not in s:
                  raise SystemExit('saveBuilding payload marker not found')
              s = s.replace(old, new, 1)

          old = """            const mosque = building.sites?.some((site) => ['mosque', 'jami'].includes(site.siteType) && site.status !== 'temporarily_closed');\n            return <Card key={building.id} className={card3d}>"""
          new = """            const mosque = building.sites?.some((site) => ['mosque', 'jami'].includes(site.siteType) && site.status !== 'temporarily_closed');\n            const hasCoordinates = Number.isFinite(Number(building.latitude)) && Number.isFinite(Number(building.longitude));\n            return <Card key={building.id} className={card3d}>"""
          if 'const hasCoordinates = Number.isFinite(Number(building.latitude))' not in s:
              if old not in s:
                  raise SystemExit('building card coordinate marker not found')
              s = s.replace(old, new, 1)

          old = """                <Info label=\"إمكانية إنشاء مصلى\" value={buildingFeasibilityLabels[building.creationFeasibility] || building.creationFeasibility} />\n                {building.unavailableReason && <Info label=\"سبب عدم الإمكانية\" value={building.unavailableReason} />}"""
          new = """                <Info label=\"إمكانية إنشاء مصلى\" value={buildingFeasibilityLabels[building.creationFeasibility] || building.creationFeasibility} />\n                {hasCoordinates && <div className=\"flex flex-wrap items-center justify-between gap-2 rounded-xl border border-sky-200 bg-sky-50/70 p-2 text-xs\"><div><span className=\"font-bold text-slate-700\">إحداثيات المبنى: </span><span dir=\"ltr\" className=\"font-mono text-sky-800\">{Number(building.latitude).toFixed(6)}, {Number(building.longitude).toFixed(6)}</span></div><a className=\"inline-flex items-center gap-1 font-bold text-sky-700 hover:underline\" href={'https://www.google.com/maps?q=' + building.latitude + ',' + building.longitude} target=\"_blank\" rel=\"noreferrer\"><MapPin className=\"h-3.5 w-3.5\" />فتح الموقع</a></div>}\n                {building.unavailableReason && <Info label=\"سبب عدم الإمكانية\" value={building.unavailableReason} />}"""
          if 'إحداثيات المبنى:' not in s:
              if old not in s:
                  raise SystemExit('building card coordinate display marker not found')
              s = s.replace(old, new, 1)

          old = """            <Field label=\"المدينة\"><Input value={buildingForm.city} onChange={(e) => setBuildingForm({ ...buildingForm, city: e.target.value })} /></Field>\n            <Field label=\"الحي\"><Input value={buildingForm.district} onChange={(e) => setBuildingForm({ ...buildingForm, district: e.target.value })} /></Field>\n            <Field label=\"حالة التغطية\">"""
          new = """            <Field label=\"المدينة\"><Input value={buildingForm.city} onChange={(e) => setBuildingForm({ ...buildingForm, city: e.target.value })} /></Field>\n            <Field label=\"الحي\"><Input value={buildingForm.district} onChange={(e) => setBuildingForm({ ...buildingForm, district: e.target.value })} /></Field>\n            <Field label=\"خط العرض Latitude\"><Input type=\"number\" step=\"any\" dir=\"ltr\" value={buildingForm.latitude} onChange={(e) => setBuildingForm({ ...buildingForm, latitude: e.target.value })} placeholder=\"26.3927\" /></Field>\n            <Field label=\"خط الطول Longitude\"><Input type=\"number\" step=\"any\" dir=\"ltr\" value={buildingForm.longitude} onChange={(e) => setBuildingForm({ ...buildingForm, longitude: e.target.value })} placeholder=\"50.1926\" /></Field>\n            <div className=\"md:col-span-2 space-y-3 rounded-2xl border border-sky-200 bg-sky-50/40 p-3\">\n              <div className=\"flex flex-wrap items-center gap-2\">\n                <Button type=\"button\" variant=\"outline\" className={'h-11 ' + button3d} onClick={captureCurrentBuildingLocation} disabled={locatingBuilding}>\n                  {locatingBuilding ? <RefreshCw className=\"ml-2 h-4 w-4 animate-spin\" /> : <MapPin className=\"ml-2 h-4 w-4\" />}\n                  {locatingBuilding ? 'جاري تحديد الموقع...' : 'تحديد موقعي الحالي'}\n                </Button>\n                <Button type=\"button\" variant=\"outline\" className={'h-11 ' + button3d} onClick={() => setShowBuildingMap((current) => !current)}>\n                  <MapPin className=\"ml-2 h-4 w-4\" />\n                  {showBuildingMap ? 'إخفاء الخريطة' : 'تحديد موقع المبنى من الخريطة'}\n                </Button>\n                {buildingPickerCoordinates && <div className=\"flex min-h-11 items-center rounded-xl border border-emerald-200 bg-emerald-50 px-4 text-xs font-semibold text-emerald-800\" dir=\"ltr\">{buildingPickerCoordinates.latitude.toFixed(6)}, {buildingPickerCoordinates.longitude.toFixed(6)}</div>}\n              </div>\n              {showBuildingMap && <div className=\"overflow-hidden rounded-2xl border border-sky-200 bg-white p-1 shadow-sm\"><MapCoordinatePicker coordinates={buildingPickerCoordinates} onChange={updateBuildingCoordinates} /></div>}\n            </div>\n            <Field label=\"حالة التغطية\">"""
          if 'تحديد موقع المبنى من الخريطة' not in s:
              if old not in s:
                  raise SystemExit('building dialog coordinate UI marker not found')
              s = s.replace(old, new, 1)

          page_path.write_text(s)
          PY
      - name: Verify frontend build
        run: npm run build
      - name: Commit implementation and cleanup
        run: |
          rm -f .github/workflows/add-mosque-building-coordinates.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/mosques.ts src/app/pages/MosquesUnitPage.tsx .github/workflows/add-mosque-building-coordinates.yml
          git commit -m 'Add map coordinates to mosque building registry'
          git push origin main
