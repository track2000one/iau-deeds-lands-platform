name: Add Imported Building Review Map Picker

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-import-review-map-picker.mjs'
      - '.github/workflows/add-import-review-map-picker.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply map picker patch
        run: node scripts/add-import-review-map-picker.mjs

      - name: Build frontend
        run: npm run build

      - name: Commit generated source change
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/BuildingExcelImportManager.tsx
          git commit -m "Add map picker to imported building review"
          git push
