name: Apply Report View Toggle Platform

on:
  push:
    paths:
      - 'scripts/apply-report-view-toggle-platform.mjs'
      - '.github/workflows/apply-report-view-toggle-platform.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Apply report cards/table patch
        run: node scripts/apply-report-view-toggle-platform.mjs

      - name: Verify build
        run: npm run build

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/ReportsPage.tsx \
                  src/app/pages/AssetReportsPage.tsx \
                  src/app/pages/AccountingTransformationReportsPage.tsx \
                  src/app/components/MosqueReportsCenter.tsx \
                  src/app/components/CentralBuildingsReports.tsx \
                  src/app/components/BuildingCoverageReportsDialog.tsx \
                  src/app/components/ArchiveReportsDialog.tsx
          git commit -m "Add cards and table views across reports"
          git push origin main
