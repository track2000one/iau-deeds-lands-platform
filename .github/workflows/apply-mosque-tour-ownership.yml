name: Apply Mosque Tour Ownership UI

on:
  push:
    paths:
      - '.github/scripts/apply-mosque-tour-ownership-ui.js'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply UI ownership patch
        run: node .github/scripts/apply-mosque-tour-ownership-ui.js
      - name: Build frontend
        run: npm run build
      - name: Remove temporary patch files
        run: rm -f .github/scripts/apply-mosque-tour-ownership-ui.js .github/workflows/apply-mosque-tour-ownership.yml
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/api/mosques.ts src/app/components/MosqueFieldVisitsPanel.tsx .github/scripts/apply-mosque-tour-ownership-ui.js .github/workflows/apply-mosque-tour-ownership.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Apply mosque tour ownership controls'
          git push origin main
