name: Apply Stable Central Building Links

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-stable-central-building-links.mjs'
      - '.github/workflows/apply-stable-central-building-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-stable-central-building-links.mjs
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/app/utils/centralBuildingLink.ts \
            src/app/pages/AddAssetPage.tsx \
            src/app/pages/EditAssetPage.tsx \
            src/app/pages/AccountingTransformationFormPage.tsx \
            src/app/pages/CentralBuildingsRegistryPage.tsx
          git commit -m "Add stable central building links and legacy migration"
          git push
