name: Refine Quran Live Search Cards

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refine-quran-live-search-cards.mjs'
      - '.github/workflows/refine-quran-live-search-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Refine Quran live search cards
        run: node scripts/refine-quran-live-search-cards.mjs

      - name: Verify build
        run: npm run build

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m "Refine Quran live search result cards"
          git push origin HEAD:main
