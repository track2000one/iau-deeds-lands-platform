name: Apply report coordinate formatting

on:
  push:
    paths:
      - .github/workflows/format-report-coordinates.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python3 .github/scripts/patch_report_coordinates.py

      - name: Commit result
        run: |
          rm .github/workflows/format-report-coordinates.yml
          rm .github/scripts/patch_report_coordinates.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format coordinates cleanly in reports"
          git push
