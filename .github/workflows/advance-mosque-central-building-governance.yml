name: Advance Mosque Central Building Governance

on:
  push:
    branches: [main]
    paths:
      - 'scripts/advance-mosque-central-building-governance.mjs'
      - '.github/workflows/advance-mosque-central-building-governance.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/advance-mosque-central-building-governance.mjs
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m "Enforce central building governance in mosque unit"
          git push
