name: Mosque permissions hotfix v2

on:
  push:
    paths:
      - '.github/workflows/mosque-permission-hotfix-v2.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch mosque permissions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/pages/MosquesUnitPage.tsx')
          s = p.read_text(encoding='utf-8')

          s = s.replace(
          """        const [requestRows, ticketRows, leaveRows, personRows, staffRows] = await Promise.all([\n          mosqueApi.requests(), mosqueApi.tickets(), mosqueApi.leaves(), mosqueApi.personnel(), mosqueApi.staffDirectory(),\n        ]);""",
          """        const [requestRows, ticketRows, leaveRows, personRows, staffRows] = await Promise.all([\n          mosqueApi.requests(),\n          mosqueApi.tickets(),\n          mosqueApi.leaves(),\n          mosqueApi.personnel(),\n          isAdmin ? mosqueApi.staffDirectory() : Promise.resolve([] as MosqueStaffUser[]),\n        ]);""", 1)
          s = s.replace('        setPersonnel(personRows);', "        setPersonnel(personRows.filter((item) => ['imam', 'muezzin', 'khateeb', 'collaborating_khateeb'].includes(item.role)));", 1)
          s = s.replace("        if (me.role === 'head') {", '        if (isAdmin) {', 1)
          s = s.replace("{role === 'head' && <TabsTrigger value=\"roles\">الأدوار التشغيلية</TabsTrigger>}", "{isAdmin && <TabsTrigger value=\"roles\">الأدوار التشغيلية</TabsTrigger>}", 1)
          s = s.replace("{role === 'head' && <Field label=\"المشرف المسؤول عن الموقع\">", "{isAdmin && <Field label=\"المشرف المسؤول عن الموقع\">", 1)
          s = s.replace('<Rule title="المنسوبون" text="إدارة المشرفين ومنسوبي المساجد وربطهم بالمواقع." />', '<Rule title="منسوبو المساجد" text="إدارة ومتابعة الإمام والمؤذن والخطيب والخطيب المتعاون فقط." />', 1)

          marker = "  useEffect(() => { loadAll(); }, []);\n"
          if marker in s and "activeTab === 'roles'" not in s:
              s = s.replace(marker, marker + "\n  useEffect(() => {\n    if (!isAdmin && activeTab === 'roles') setActiveTab('team');\n  }, [isAdmin, activeTab]);\n", 1)

          marker2 = "  const setUserAssignment = async (userId: string, roleValue: MosqueModuleRole, siteId?: string, personnelRole?: string) => {\n"
          if marker2 in s and "إدارة أدوار مستخدمي المنصة متاحة لمسؤول النظام فقط" not in s:
              s = s.replace(marker2, marker2 + "    if (!isAdmin) {\n      toast.error('إدارة أدوار مستخدمي المنصة متاحة لمسؤول النظام فقط');\n      return;\n    }\n", 1)

          required = [
            "isAdmin ? mosqueApi.staffDirectory()",
            "personRows.filter((item) => ['imam', 'muezzin', 'khateeb', 'collaborating_khateeb'].includes(item.role))",
            "{isAdmin && <TabsTrigger value=\"roles\">الأدوار التشغيلية</TabsTrigger>}",
            "إدارة أدوار مستخدمي المنصة متاحة لمسؤول النظام فقط",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing hotfix markers: ' + repr(missing))
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Commit
        shell: bash
        run: |
          git config user.name "OpenAI Project Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-mosque-user-scope-20260818.yml .github/workflows/mosque-permission-hotfix-v2.yml
          git add src/app/pages/MosquesUnitPage.tsx .github/workflows/apply-mosque-user-scope-20260818.yml .github/workflows/mosque-permission-hotfix-v2.yml
          git commit -m "fix: restrict mosque leadership to mosque personnel"
          git push origin HEAD:main
