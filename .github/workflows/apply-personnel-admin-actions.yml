name: Apply mosque personnel admin actions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-personnel-admin-actions.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply frontend changes
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_personnel.py
          python3 /tmp/patch_personnel.py
      - name: Install dependencies
        run: npm ci
      - name: Build verification
        run: npm run build
      - name: Commit verified changes
        run: |
          rm -f .github/workflows/apply-personnel-admin-actions.yml
          git config user.name "OpenAI Project Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx src/app/api/mosques.ts .github/workflows/apply-personnel-admin-actions.yml
          git commit -m "feat: enable mosque personnel admin actions"
          git push origin HEAD:main
