name: Apply Accounting Evidence Audit Center

on:
  push:
    branches:
      - feat/accounting-evidence-audit-center

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: python3 scripts/apply-accounting-evidence-audit-center.py
      - run: npm run build
      - name: Remove temporary automation files
        run: |
          rm -f scripts/apply-accounting-evidence-audit-center.py
          rm -f .github/workflows/apply-accounting-evidence-audit-center.yml
      - name: Commit integration changes
        run: |
          git config user.name "track2000one"
          git config user.email "track2000one@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No integration changes to commit"
          else
            git commit -m "ربط السجل الرقابي المركزي بالتحول المحاسبي"
            git push origin HEAD:feat/accounting-evidence-audit-center
          fi
