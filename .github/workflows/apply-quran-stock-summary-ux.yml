name: Apply Quran Stock Summary UX

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-quran-stock-summary-ux.py'
      - '.github/workflows/apply-quran-stock-summary-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-quran-stock-summary-ux.py
      - run: npm ci
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/mosques.ts src/app/pages/MosquesUnitPage.tsx
          git commit -m "Clarify Quran stock balance and movement totals"
          git push
