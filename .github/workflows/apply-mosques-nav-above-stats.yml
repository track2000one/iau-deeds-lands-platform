name: Apply Mosques Navigation Above Stats

on:
  push:
    branches: [main]
    paths:
      - 'scripts/move-mosques-nav-above-stats.mjs'
      - '.github/workflows/apply-mosques-nav-above-stats.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: |
          git pull --rebase origin main

      - name: Move navigation above statistics
        run: node scripts/move-mosques-nav-above-stats.mjs

      - name: Verify build
        run: npm run build

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m "Move mosque navigation above statistics cards"
          git push origin HEAD:main

# Triggered after workflow creation so the source reorder is applied and verified.
