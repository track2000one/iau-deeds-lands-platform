name: Verify Accounting Evidence History

on:
  push:
    branches:
      - feat/accounting-evidence-history
    paths:
      - src/app/config/accountingPropertyEvidenceHistory.ts
      - .github/workflows/verify-accounting-evidence-history.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Remove temporary verification workflow
        run: git rm -f .github/workflows/verify-accounting-evidence-history.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git commit -m "Verify accounting evidence history build"
          git push
