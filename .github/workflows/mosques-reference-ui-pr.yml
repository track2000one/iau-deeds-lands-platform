name: Mosque Reference UI PR Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/pages/MosquesUnitPage.tsx"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
