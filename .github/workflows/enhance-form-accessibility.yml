name: Enhance Form Accessibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/enhance-form-accessibility.py'
      - '.github/workflows/enhance-form-accessibility.yml'

permissions:
  contents: write

concurrency:
  group: enhance-form-accessibility
  cancel-in-progress: true

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply accessibility enhancement
        run: python3 scripts/enhance-form-accessibility.py

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend build
        run: npm run build

      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/globals.css src/lib/formAccessibility.ts src/main.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "feat(ui): improve form focus and required-field visibility"
          git push origin main
