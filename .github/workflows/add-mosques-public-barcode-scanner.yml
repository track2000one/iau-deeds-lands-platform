name: Add Mosque Mobile Barcode Scanner
on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-mosques-public-barcode-scanner.cjs'
      - '.github/workflows/add-mosques-public-barcode-scanner.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm install html5-qrcode@2.3.8 --save-exact
      - run: node scripts/add-mosques-public-barcode-scanner.cjs
      - run: npm run build
      - name: Commit mosque barcode scanner
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/app/pages/MosquesPublicPage.tsx
          git commit -m "Add mobile mosque QR and barcode scanner"
          git restore --worktree .
          git pull --rebase origin main
          git push origin main
