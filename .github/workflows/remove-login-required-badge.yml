name: Remove Login Required Badge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/remove-login-required-badge.py'
      - '.github/workflows/remove-login-required-badge.yml'

permissions:
  contents: write

concurrency:
  group: remove-login-required-badge
  cancel-in-progress: true

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply login cleanup
        run: python3 scripts/remove-login-required-badge.py

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend build
        run: npm run build

      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/LoginPage.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "fix(login): remove redundant required badges"
          git push origin main
