name: Set Large Default Font Size

on:
  push:
    branches: [main]
    paths:
      - 'scripts/set-large-default-font-size.mjs'
      - '.github/workflows/set-large-default-font-size.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Apply large default font size
        run: node scripts/set-large-default-font-size.mjs

      - name: Verify build
        run: npm run build

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No source changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/theme/userDisplayPreferences.ts src/app/pages/AppearanceSettingsPage.tsx
          git commit -m "Set 18px as default platform font size"
          git push origin main
