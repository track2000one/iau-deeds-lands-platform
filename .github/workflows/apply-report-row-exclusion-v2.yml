name: Apply report row exclusion patch v2

on:
  push:
    paths:
      - '.github/workflows/apply-report-row-exclusion-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ReportsPage safely
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/app/pages/ReportsPage.tsx')
          text = path.read_text(encoding='utf-8')

          def once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          once(
              "  ChevronDown,\n  ChevronUp,\n  Download,",
              "  ChevronDown,\n  ChevronUp,\n  X,\n  Download,",
              'import X',
          )

          state_anchor = """  const [printSettingsBySection, setPrintSettingsBySection] = useState<Record<ReportSectionType, PrintSettings>>({"""
          state_block = """  const [excludedRowKeysBySection, setExcludedRowKeysBySection] = useState<
    Record<ReportSectionType, string[]>
  >({
    deeds: [],
    allocated: [],
    delivered: [],
    leasedOut: [],
    leasedIn: [],
    buildingsOut: [],
    buildingsIn: [],
    siteInspections: [],
  });

"""
          once(state_anchor, state_block + state_anchor, 'excluded state')

          apply_anchor = """  const applyManualRowOrder = (
    data: any[],
    section: ReportSectionType,
  ): any[] => {
    if (!manualOrderEnabledBySection[section]) {
      return data;
    }

    const manualOrder = manualRowOrderBySection[section] || [];
    const rank = new Map(manualOrder.map((key, index) => [key, index]));

    return [...data].sort((first, second) => {"""
          apply_replacement = """  const excludeManualRow = (section: ReportSectionType, rowKey: string) => {
    setExcludedRowKeysBySection((prev) => {
      const current = prev[section] || [];
      if (current.includes(rowKey)) return prev;

      return {
        ...prev,
        [section]: [...current, rowKey],
      };
    });
  };

  const restoreExcludedRows = (section: ReportSectionType) => {
    setExcludedRowKeysBySection((prev) => ({
      ...prev,
      [section]: [],
    }));
  };

  const applyManualRowOrder = (
    data: any[],
    section: ReportSectionType,
  ): any[] => {
    if (!manualOrderEnabledBySection[section]) {
      return data;
    }

    const manualOrder = manualRowOrderBySection[section] || [];
    const excludedKeys = new Set(excludedRowKeysBySection[section] || []);
    const rank = new Map(manualOrder.map((key, index) => [key, index]));
    const visibleData = data.filter((item, index) =>
      !excludedKeys.has(getManualRowKey(item, index))
    );

    return [...visibleData].sort((first, second) => {"""
          once(apply_anchor, apply_replacement, 'apply exclusion')

          enable_anchor = """    setManualOrderEnabledBySection((prev) => ({
      ...prev,
      [section]: true,
    }));
  };"""
          enable_replacement = """    setExcludedRowKeysBySection((prev) => ({
      ...prev,
      [section]: [],
    }));

    setManualOrderEnabledBySection((prev) => ({
      ...prev,
      [section]: true,
    }));
  };"""
          once(enable_anchor, enable_replacement, 'enable reset')

          disable_anchor = """    setManualRowOrderBySection((prev) => ({
      ...prev,
      [section]: [],
    }));
  };

  const moveManualRow = ("""
          disable_replacement = """    setManualRowOrderBySection((prev) => ({
      ...prev,
      [section]: [],
    }));

    setExcludedRowKeysBySection((prev) => ({
      ...prev,
      [section]: [],
    }));
  };

  const moveManualRow = ("""
          once(disable_anchor, disable_replacement, 'disable reset')

          position_anchor = """  const moveManualRowToPosition = (
    section: ReportSectionType,
    rowKey: string,
    requestedPosition: number,
  ) => {
    setManualRowOrderBySection((prev) => {"""
          position_replacement = """  const moveManualRowToPosition = (
    section: ReportSectionType,
    rowKey: string,
    requestedPosition: number,
  ) => {
    if (requestedPosition <= 0) {
      excludeManualRow(section, rowKey);
      return;
    }

    setManualRowOrderBySection((prev) => {"""
          once(position_anchor, position_replacement, 'zero exclusion')

          data_anchor = """    const sortedData = applyManualRowOrder(automaticallySortedData, type);
    const manualOrderEnabled = manualOrderEnabledBySection[type];
    const enabledColumns = columns.filter((col) => col.enabled);"""
          data_replacement = """    const sortedData = applyManualRowOrder(automaticallySortedData, type);
    const manualOrderEnabled = manualOrderEnabledBySection[type];
    const excludedCount = (excludedRowKeysBySection[type] || []).length;
    const enabledColumns = columns.filter((col) => col.enabled);"""
          once(data_anchor, data_replacement, 'excluded count')

          old_notice = "الترتيب اليدوي مفعّل. استخدم أدوات «ترتيب الصف» داخل الجدول لنقل كل سجل إلى الموضع المطلوب. هذا الترتيب يطبّق على Excel وPDF والطباعة."
          new_notice = """<span>
                          الترتيب اليدوي مفعّل. استخدم الأسهم أو رقم الموضع لترتيب السجلات. اكتب 0 أو اضغط × لاستبعاد الصف من التقرير. الصفوف المستبعدة لا تظهر في Excel أو PDF أو الطباعة.
                        </span>
                        {excludedCount > 0 && (
                          <Button
                            type="button"
                            variant="outline"
                            size="sm"
                            className="mr-3 border-amber-300 bg-white/80"
                            onClick={() => restoreExcludedRows(type)}
                          >
                            استعادة المستبعد ({excludedCount})
                          </Button>
                        )}"""
          once(old_notice, new_notice, 'notice')

          once(
              '<TableHead className="w-[170px] px-2 py-2 text-center text-white">\n                              ترتيب الصف\n                            </TableHead>',
              '<TableHead className="w-[210px] px-2 py-2 text-center text-white">\n                              ترتيب / استبعاد\n                            </TableHead>',
              'header',
          )

          once('                                        min={1}\n', '                                        min={0}\n', 'min zero')
          once('                                        title="رقم ترتيب الصف"\n', '                                        title="رقم ترتيب الصف — اكتب 0 للاستبعاد"\n', 'input title')

          down_button = """                                      <Button
                                        type="button"
                                        variant="outline"
                                        size="icon"
                                        className="h-8 w-8"
                                        disabled={index === sortedData.length - 1}
                                        onClick={() => moveManualRow(type, rowKey, 'down')}
                                        title="تحريك الصف للأسفل"
                                      >
                                        <ChevronDown className="h-4 w-4" />
                                      </Button>"""
          down_plus_x = down_button + """

                                      <Button
                                        type="button"
                                        variant="outline"
                                        size="icon"
                                        className="h-8 w-8 border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100 hover:text-rose-800"
                                        onClick={() => excludeManualRow(type, rowKey)}
                                        title="استبعاد الصف من التقرير"
                                      >
                                        <X className="h-4 w-4" />
                                      </Button>"""
          once(down_button, down_plus_x, 'X button')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify and build
        shell: bash
        run: |
          grep -q "excludedRowKeysBySection" src/app/pages/ReportsPage.tsx
          grep -q "اكتب 0 للاستبعاد" src/app/pages/ReportsPage.tsx
          grep -q "استبعاد الصف من التقرير" src/app/pages/ReportsPage.tsx
          npm ci
          npm run build

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "OpenAI Platform Assistant"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/pages/ReportsPage.tsx
          git commit -m "Add professional row exclusion to reports"
          git push origin HEAD:main
