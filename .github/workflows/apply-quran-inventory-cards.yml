name: Apply Quran Inventory Cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-quran-inventory-cards.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: python3 scripts/apply-quran-inventory-cards.py
      - run: npm ci
      - run: npm run build
      - name: Remove temporary patch files
        run: rm -f scripts/apply-quran-inventory-cards.py .github/workflows/apply-quran-inventory-cards.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx scripts/apply-quran-inventory-cards.py .github/workflows/apply-quran-inventory-cards.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Use responsive Quran inventory cards"
            git push origin main
          fi
