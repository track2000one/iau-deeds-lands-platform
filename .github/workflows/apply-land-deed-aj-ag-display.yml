name: Apply land deed AJ AG display

on:
  push:
    branches:
      - fix/land-deed-aj-ag-display
    paths:
      - scripts/apply-land-deed-aj-ag-display.py
      - .github/workflows/apply-land-deed-aj-ag-display.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/land-deed-aj-ag-display
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply implementation
        run: python3 scripts/apply-land-deed-aj-ag-display.py

      - name: Build frontend
        run: npm run build

      - name: Remove temporary implementation files
        run: |
          rm -f scripts/apply-land-deed-aj-ag-display.py
          rm -f .github/workflows/apply-land-deed-aj-ag-display.yml

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 0
          fi
          git commit -m "Show land deed identity from AJ and AG [skip ci]"
          git push origin HEAD:fix/land-deed-aj-ag-display
