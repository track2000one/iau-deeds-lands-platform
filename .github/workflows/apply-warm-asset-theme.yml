name: Apply Warm Asset Theme

on:
  push:
    paths:
      - 'scripts/apply-warm-asset-theme.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: node scripts/apply-warm-asset-theme.cjs
      - run: npm ci
      - run: npm run build
      - name: Commit generated theme changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/theme/appearanceThemes.ts src/app/pages/AssetDashboardPage.tsx
          git diff --cached --quiet || git commit -m "Add warm university asset theme"
          git push
