name: Apply Mosque Coordinator Name Frontend

on:
  push:
    branches: [feature/mosque-coordinator-name]
    paths:
      - '.github/workflows/apply-mosque-coordinator-name.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mosque-coordinator-name
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-mosque-coordinator-name.mjs
      - run: npm run build
      - name: Remove temporary patch files
        run: rm -f scripts/apply-mosque-coordinator-name.mjs .github/workflows/apply-mosque-coordinator-name.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/mosques.ts src/app/pages/MosquesUnitPage.tsx scripts/apply-mosque-coordinator-name.mjs .github/workflows/apply-mosque-coordinator-name.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add mosque coordinator name field"
            git push origin feature/mosque-coordinator-name
          fi
