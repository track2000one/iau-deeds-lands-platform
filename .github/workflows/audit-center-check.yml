name: Audit Center Check
on:
  push:
    branches: [feat/accounting-evidence-audit-center]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: python3 scripts/fix-accounting-evidence-audit-center.py
      - run: npm run build
      - name: Commit applied fixes
        run: |
          git config user.name "track2000one"
          git config user.email "track2000one@gmail.com"
          git add src/app/pages/AccountingPropertyEvidenceAuditPage.tsx src/app/pages/AccountingPropertyEvidenceDashboardPage.tsx
          if ! git diff --cached --quiet; then
            git commit -m "تحسين فلاتر وربط السجل الرقابي المركزي"
            git push origin HEAD:feat/accounting-evidence-audit-center
          fi
