name: Apply Official Asset Excel Fields

on:
  push:
    paths:
      - 'scripts/apply-official-asset-excel-fields.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/apply-official-asset-excel-fields.mjs
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/AssetOfficialTemplateFields.tsx src/app/pages/AddAssetPage.tsx src/app/pages/EditAssetPage.tsx
          git commit -m "Reflect approved asset Excel fields in asset forms"
          git push origin HEAD:main
