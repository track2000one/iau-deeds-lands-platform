name: Fix Accounting Evidence Audit Append

on:
  push:
    branches:
      - feat/accounting-evidence-user-audit
    paths:
      - scripts/fix-accounting-evidence-audit-append.py
      - .github/workflows/fix-accounting-evidence-audit-append.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/accounting-evidence-user-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: python3 scripts/fix-accounting-evidence-audit-append.py
      - run: npm run build
      - name: Remove temporary automation files
        run: rm -f scripts/fix-accounting-evidence-audit-append.py .github/workflows/fix-accounting-evidence-audit-append.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/config/accountingPropertyEvidenceHistory.ts scripts/fix-accounting-evidence-audit-append.py .github/workflows/fix-accounting-evidence-audit-append.yml
          git diff --cached --quiet || git commit -m "تصحيح سلامة سجل التدقيق الإلحاقي"
          git push origin HEAD:feat/accounting-evidence-user-audit
