name: Add Asset Operation Date Filter

on:
  push:
    paths:
      - 'scripts/add-asset-operation-date-filter.cjs'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply asset report date filter patch
        run: node scripts/add-asset-operation-date-filter.cjs
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend build
        run: npm run build
      - name: Commit generated frontend changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/assets.ts src/app/pages/AssetReportsPage.tsx
          git commit -m "Add asset data-entry date filter to reports"
          git push origin HEAD:main
