name: Hide Required Badge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/hide-required-badge.py'
      - '.github/workflows/hide-required-badge.yml'

permissions:
  contents: write

concurrency:
  group: hide-required-badge
  cancel-in-progress: true

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply required badge visibility change
        run: python3 scripts/hide-required-badge.py
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend build
        run: npm run build
      - name: Commit verified frontend source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/globals.css
          if git diff --cached --quiet; then
            echo "No frontend source changes to commit"
            exit 0
          fi
          git commit -m "style(ui): hide required text badges"
          git push origin main
