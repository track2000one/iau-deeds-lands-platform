name: Verify Accounting Draft Reimport Frontend

on:
  push:
    branches: [agent/accounting-draft-reimport-update]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
