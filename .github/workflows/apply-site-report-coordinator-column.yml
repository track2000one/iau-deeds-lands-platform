name: Apply Site Report Coordinator Column

on:
  push:
    branches: [feature/site-report-coordinator-column]
    paths:
      - '.github/workflows/apply-site-report-coordinator-column.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-report-coordinator-column
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-site-report-coordinator-column.mjs
      - run: npm run build
      - name: Remove temporary patch files
        run: rm -f scripts/apply-site-report-coordinator-column.mjs .github/workflows/apply-site-report-coordinator-column.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx scripts/apply-site-report-coordinator-column.mjs .github/workflows/apply-site-report-coordinator-column.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add coordinator name to mosque reports"
            git push origin feature/site-report-coordinator-column
          fi
