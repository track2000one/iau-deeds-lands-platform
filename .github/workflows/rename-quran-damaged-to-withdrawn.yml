name: Rename Quran Damaged To Withdrawn

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/rename-quran-damaged-to-withdrawn.py'
      - '.github/workflows/rename-quran-damaged-to-withdrawn.yml'

permissions:
  contents: write

concurrency:
  group: rename-quran-damaged-to-withdrawn
  cancel-in-progress: true

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Update Quran terminology
        run: python3 scripts/rename-quran-damaged-to-withdrawn.py

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend build
        run: npm run build

      - name: Commit verified source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          if git diff --cached --quiet; then
            echo "No frontend source changes to commit"
            exit 0
          fi
          git commit -m "fix(mosques): rename damaged Quran copies to withdrawn"
          git push origin main
