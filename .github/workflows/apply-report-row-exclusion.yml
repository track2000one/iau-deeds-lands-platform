name: Apply report row exclusion patch

on:
  push:
    paths:
      - '.github/workflows/apply-report-row-exclusion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch ReportsPage
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/app/pages/ReportsPage.tsx')
          text = path.read_text(encoding='utf-8')

          def once(old: str, new: str, label: str):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, found {count}')
              text = text.replace(old, new, 1)

          once(
              "  ChevronDown,\n  ChevronUp,\n  Download,",
              "  ChevronDown,\n  ChevronUp,\n  X,\n  Download,",
              'import X',
          )

          anchor = """  const [printSettingsBySection, setPrintSettingsBySection] = useState<Record<ReportSectionType, PrintSettings>>({"""
          block = """  const [excludedRowKeysBySection, setExcludedRowKeysBySection] = useState<
    Record<ReportSectionType, string[]>
  >({
    deeds: [],
    allocated: [],
    delivered: [],
    leasedOut: [],
    leasedIn: [],
    buildingsOut: [],
    buildingsIn: [],
    siteInspections: [],
  });

"""
          once(anchor, block + anchor, 'state')

          old_apply = """  const applyManualRowOrder = (
    data: any[],
    section: ReportSectionType,
  ): any[] => {
    if (!manualOrderEnabledBySection[section]) {
      return data;
    }

    const manualOrder = manualRowOrderBySection[section] || [];
    const rank = new Map(manualOrder.map((key, index) => [key, index]));

    return [...data].sort((first, second) => {"""
          new_apply = """  const excludeManualRow = (section: ReportSectionType, rowKey: string) => {
    setExcludedRowKeysBySection((prev) => {
      const current = prev[section] || [];
      if (current.includes(rowKey)) return prev;
      return { ...prev, [section]: [...current, rowKey] };
    });
  };

  const applyManualRowOrder = (
    data: any[],
    section: ReportSectionType,
  ): any[] => {
    if (!manualOrderEnabledBySection[section]) {
      return data;
    }

    const manualOrder = manualRowOrderBySection[section] || [];
    const excludedKeys = new Set(excludedRowKeysBySection[section] || []);
    const rank = new Map(manualOrder.map((key, index) => [key, index]));
    const visibleData = data.filter((item, index) =>
      !excludedKeys.has(getManualRowKey(item, index))
    );

    return [...visibleData].sort((first, second) => {"""
          once(old_apply, new_apply, 'apply')

          once(
              """  const moveManualRowToPosition = (
    section: ReportSectionType,
    rowKey: string,
    requestedPosition: number,
  ) => {
    setManualRowOrderBySection((prev) => {""",
              """  const moveManualRowToPosition = (
    section: ReportSectionType,
    rowKey: string,
    requestedPosition: number,
  ) => {
    if (requestedPosition <= 0) {
      excludeManualRow(section, rowKey);
      return;
    }

    setManualRowOrderBySection((prev) => {""",
              'zero excludes',
          )

          once(
              '<TableHead className="w-[170px] px-2 py-2 text-center text-white">\n                              ترتيب الصف\n                            </TableHead>',
              '<TableHead className="w-[210px] px-2 py-2 text-center text-white">\n                              ترتيب / استبعاد\n                            </TableHead>',
              'header',
          )

          once('                                        min={1}\n', '                                        min={0}\n', 'min')
          once('                                        title="رقم ترتيب الصف"\n', '                                        title="رقم ترتيب الصف — اكتب 0 للاستبعاد"\n', 'title')

          down = """                                      <Button
                                        type="button"
                                        variant="outline"
                                        size="icon"
                                        className="h-8 w-8"
                                        disabled={index === sortedData.length - 1}
                                        onClick={() => moveManualRow(type, rowKey, 'down')}
                                        title="تحريك الصف للأسفل"
                                      >
                                        <ChevronDown className="h-4 w-4" />
                                      </Button>"""
          xbutton = down + """

                                      <Button
                                        type="button"
                                        variant="outline"
                                        size="icon"
                                        className="h-8 w-8 border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100 hover:text-rose-800"
                                        onClick={() => excludeManualRow(type, rowKey)}
                                        title="استبعاد الصف من التقرير"
                                      >
                                        <X className="h-4 w-4" />
                                      </Button>"""
          once(down, xbutton, 'x button')

          # Keep exclusions scoped to the active manual editing session.
          once(
              """    setManualRowOrderBySection((prev) => ({
      ...prev,
      [section]: [],
    }));
  };

  const moveManualRow = (""",
              """    setManualRowOrderBySection((prev) => ({
      ...prev,
      [section]: [],
    }));

    setExcludedRowKeysBySection((prev) => ({
      ...prev,
      [section]: [],
    }));
  };

  const moveManualRow = (""",
              'reset exclusions',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify and build
        shell: bash
        run: |
          grep -q "excludedRowKeysBySection" src/app/pages/ReportsPage.tsx
          grep -q "اكتب 0 للاستبعاد" src/app/pages/ReportsPage.tsx
          grep -q "استبعاد الصف من التقرير" src/app/pages/ReportsPage.tsx
          npm ci
          npm run build

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "OpenAI Platform Assistant"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/pages/ReportsPage.tsx
          git commit -m "Add row exclusion to report ordering"
          git push origin HEAD:main
