name: Apply Prominent Quran Search Field

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-quran-search-prominent.mjs'
      - '.github/workflows/apply-quran-search-prominent.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync latest main
        run: |
          git pull --ff-only origin main
      - name: Apply prominent Quran search field patch
        run: node scripts/apply-quran-search-prominent.mjs
      - name: Verify build
        run: npm run build
      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m "Make Quran search field more prominent"
          git push origin main
