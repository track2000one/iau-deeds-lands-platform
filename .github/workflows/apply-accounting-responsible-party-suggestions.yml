name: Apply Accounting Responsible Party Suggestions

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-accounting-responsible-party-suggestions.mjs'
      - '.github/workflows/apply-accounting-responsible-party-suggestions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: node scripts/apply-accounting-responsible-party-suggestions.mjs
      - run: npm ci
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AccountingTransformationFormPage.tsx
          git commit -m "Add organization suggestions to accounting custodian fields"
          git push origin HEAD:${{ github.head_ref }}
