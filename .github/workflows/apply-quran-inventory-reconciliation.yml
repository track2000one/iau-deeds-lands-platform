          new_header = """          <div className=\"flex items-start justify-between gap-3\"><div><CardTitle className=\"text-base\">{visit.site.name}</CardTitle><CardDescription className=\"mt-1\">{visit.visitNumber}</CardDescription></div><div className=\"flex flex-col items-end gap-1.5\"><StatusBadge status={visit.workflowStatus} />{quranVisitNeedsCorrection(visit) && <Badge className=\"bg-amber-600 text-white\"><AlertTriangle className=\"ml-1 h-3 w-3\" />جرد المصاحف يحتاج تصحيح</Badge>}</div></div>\n"""
          if old_header not in panel:
            raise SystemExit('visit card header anchor missing')
          panel = panel.replace(old_header, new_header, 1)

          panel_path.write_text(panel, encoding='utf-8')
