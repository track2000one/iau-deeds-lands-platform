name: Apply Quran Visit Inventory Reconciliation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-quran-inventory-reconciliation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply Quran inventory reconciliation patch
        run: python3 scripts/apply-quran-inventory-reconciliation.py
      - name: Build frontend
        run: npm run build
      - name: Commit source change and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-quran-inventory-reconciliation.yml
          git rm scripts/apply-quran-inventory-reconciliation.py
          git add src/app/api/mosques.ts src/app/components/MosqueFieldVisitsPanel.tsx
          git commit -m "Add Quran visit inventory correction workflow"
          git push origin main
