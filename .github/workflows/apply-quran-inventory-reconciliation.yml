          editor_pattern = re.compile(r"const QuranFieldInventoryEditor: React\.FC<\{.*?\n\};\n\nconst QuranVisitStockLink", re.S)
          editor_replacement = r'''const QuranFieldInventoryEditor: React.FC<{
