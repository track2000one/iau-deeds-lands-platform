name: Apply Assets Soft 3D

on:
  push:
    paths:
      - 'scripts/apply-assets-soft-3d.cjs'
      - '.github/workflows/apply-assets-soft-3d.yml'

permissions:
  contents: write

jobs:
  soft3d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Soft 3D redesign
        run: node scripts/apply-assets-soft-3d.cjs
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend build
        run: npm run build
      - name: Commit Soft 3D redesign
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AssetsPage.tsx
          git commit -m "Apply Soft 3D styling to asset cards"
          git push origin HEAD:main
