name: Apply Mosque Personnel Self Service UI 20260813
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-mosque-personnel-self-service-20260813.py'
      - '.github/workflows/apply-mosque-personnel-self-service-20260813.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 scripts/apply-mosque-personnel-self-service-20260813.py
      - run: npm run build
      - name: Commit mosque personnel self-service UI
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m "Limit mosque self-service actions to mosque personnel"
          git restore --worktree .
          git pull --rebase origin main
          git push origin main
