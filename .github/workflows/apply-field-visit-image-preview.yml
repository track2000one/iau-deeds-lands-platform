name: Apply Field Visit Image Preview Fix

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-field-visit-image-preview.py'
      - '.github/workflows/apply-field-visit-image-preview.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-field-visit-image-preview.py
      - run: npm ci
      - run: npm run build
      - name: Commit changes and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-field-visit-image-preview.py .github/workflows/apply-field-visit-image-preview.yml
          git add src/app/components/MosqueFieldVisitsPanel.tsx
          git commit -m "Show uploaded field visit image previews"
          git push origin main
