name: Verify Hierarchical Accounting Groups Frontend

on:
  push:
    branches: [agent/hierarchical-accounting-groups]
  pull_request:
    branches: [main]

concurrency:
  group: verify-hierarchical-accounting-groups-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
