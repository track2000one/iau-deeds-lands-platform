name: Apply Quran Site Stock Clarity

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-quran-site-stock-clarity.mjs'
      - '.github/workflows/apply-quran-site-stock-clarity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-quran-site-stock-clarity.mjs
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/MosqueFieldVisitsPanel.tsx
          git commit -m "Clarify mosque Quran stock versus central library"
          git push
