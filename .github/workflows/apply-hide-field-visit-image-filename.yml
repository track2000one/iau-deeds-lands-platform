name: Apply Hidden Field Visit Image Filename

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-hide-field-visit-image-filename.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply UI patch
        run: python3 scripts/hide-field-visit-image-filename.py
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Commit changes and clean temporary files
        run: |
          rm -f scripts/hide-field-visit-image-filename.py
          rm -f .github/workflows/apply-hide-field-visit-image-filename.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/components/MosqueFieldVisitsPanel.tsx scripts/hide-field-visit-image-filename.py .github/workflows/apply-hide-field-visit-image-filename.yml
          git commit -m 'Hide field visit image filename' || exit 0
          git push origin main
