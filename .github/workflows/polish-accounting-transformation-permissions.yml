name: Polish Accounting Transformation Permissions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/polish-accounting-transformation-permissions.cjs'
      - '.github/workflows/polish-accounting-transformation-permissions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/polish-accounting-transformation-permissions.cjs
      - run: npm run build
      - name: Commit permission polish
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AccountingTransformationDashboardPage.tsx src/app/pages/AccountingTransformationReportsPage.tsx
          git commit -m "Tighten accounting transformation permissions"
          git push
