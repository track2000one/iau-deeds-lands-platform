name: Apply Accounting Template Profile UI
on:
  push:
    branches: [agent/accounting-template-profiles-v1]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/accounting-template-profiles-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch scoped import page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/pages/AccountingTransformationScopedImportPage.tsx')
          s = p.read_text()
          old = "import type { StructuralAccountingWorkbookInspection } from '../../utils/accountingWorkbookStructuralIntake';\nimport { analyzeAccountingWorkbookOffThread } from '../../utils/accountingWorkbookWorkerClient';"
          new = "import type { StructuralAccountingWorkbookInspection } from '../../utils/accountingWorkbookStructuralIntake';\nimport type { AccountingExcelTemplateDetection } from '../../utils/accountingExcelTemplateProfiles';\nimport { analyzeAccountingWorkbookOffThread } from '../../utils/accountingWorkbookWorkerClient';"
          assert old in s
          s = s.replace(old, new, 1)

          old = "  const [inspection, setInspection] = useState<StructuralAccountingWorkbookInspection | null>(null);\n  const [modelBSheets, setModelBSheets] = useState<ModelBSheetInspection[]>([]);"
          new = "  const [inspection, setInspection] = useState<StructuralAccountingWorkbookInspection | null>(null);\n  const [templateDetection, setTemplateDetection] = useState<AccountingExcelTemplateDetection | null>(null);\n  const [modelBSheets, setModelBSheets] = useState<ModelBSheetInspection[]>([]);"
          assert old in s
          s = s.replace(old, new, 1)

          old = "    setInspection(null);\n    setModelBSheets([]);"
          new = "    setInspection(null);\n    setTemplateDetection(null);\n    setModelBSheets([]);"
          assert old in s
          s = s.replace(old, new, 1)

          old = "    setInspection(null);\n    setModelBSheets([]);\n    setImportScope('changes');"
          new = "    setInspection(null);\n    setTemplateDetection(null);\n    setModelBSheets([]);\n    setImportScope('changes');"
          assert old in s
          s = s.replace(old, new, 1)

          old = "      setInspection(analyzed.inspection);\n      setModelBSheets(analyzed.modelBSheets);"
          new = "      setInspection(analyzed.inspection);\n      setTemplateDetection(analyzed.templateDetection);\n      setModelBSheets(analyzed.modelBSheets);"
          assert old in s
          s = s.replace(old, new, 1)

          old = "      if (!parsed.length) {\n        setMessage(`${intakeMessage} لم تُكتب أي بيانات لأن النظام لم يجد سجلات يمكن ربطها آليًا.`);\n        toast.warning('تمت قراءة الملف، ولكن لا توجد سجلات قابلة للربط الآلي');\n        return;\n      }"
          new = "      if (!analyzed.templateDetection.safeForAutomaticImport) {\n        setMessage(`${intakeMessage} تم إيقاف الاستيراد لأن ملف القالب لم يصل إلى درجة الثقة المطلوبة. يجب اعتماد خريطة الحقول أولًا؛ لم تُكتب أي بيانات.`);\n        toast.warning('قالب Excel غير مؤكد — تم إيقاف الاستيراد لحماية البيانات');\n        return;\n      }\n\n      if (!parsed.length) {\n        setMessage(`${intakeMessage} لم تُكتب أي بيانات لأن النظام لم يجد سجلات يمكن ربطها آليًا.`);\n        toast.warning('تمت قراءة الملف، ولكن لا توجد سجلات قابلة للربط الآلي');\n        return;\n      }"
          assert old in s
          s = s.replace(old, new, 1)

          old = "      setItems([]);\n      setInspection(null);\n      setModelBSheets([]);"
          new = "      setItems([]);\n      setInspection(null);\n      setTemplateDetection(null);\n      setModelBSheets([]);"
          assert old in s
          s = s.replace(old, new, 1)

          marker = "      {inspection && <Card className=\"rounded-[26px]\">"
          assert marker in s
          card = '''      {templateDetection && <Card className={`rounded-[26px] ${templateDetection.safeForAutomaticImport ? 'border-emerald-200 bg-emerald-50/35' : 'border-amber-300 bg-amber-50/60'}`}>
        <CardHeader><CardTitle className="flex items-center gap-2"><ShieldCheck className={`h-5 w-5 ${templateDetection.safeForAutomaticImport ? 'text-emerald-700' : 'text-amber-700'}`} />ملف تعريف قالب Excel المكتشف</CardTitle></CardHeader>
        <CardContent className="space-y-3">
          <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-5">
            <div className="rounded-2xl border bg-white p-4 xl:col-span-2"><p className="text-xs text-slate-500">القالب</p><p className="mt-1 font-black text-slate-950">{templateDetection.profileName}</p><p className="mt-1 text-[11px] text-slate-500">{templateDetection.version ? `الإصدار: ${templateDetection.version}` : 'بدون إصدار مسجل'}</p></div>
            <div className="rounded-2xl border bg-white p-4"><p className="text-xs text-slate-500">درجة التعرف</p><p className="mt-1 text-2xl font-black">{templateDetection.confidence.toLocaleString('ar-SA')}%</p></div>
            <div className="rounded-2xl border bg-white p-4"><p className="text-xs text-slate-500">أوراق البيانات</p><p className="mt-1 text-2xl font-black">{templateDetection.dataSheetCount.toLocaleString('ar-SA')}</p></div>
            <div className="rounded-2xl border bg-white p-4"><p className="text-xs text-slate-500">مراجع/تعليمات</p><p className="mt-1 text-2xl font-black">{templateDetection.referenceSheetCount.toLocaleString('ar-SA')}</p></div>
          </div>
          <div className={`rounded-xl border px-4 py-3 text-xs leading-6 ${templateDetection.safeForAutomaticImport ? 'border-emerald-200 bg-white text-emerald-900' : 'border-amber-300 bg-white text-amber-950'}`}>
            {templateDetection.safeForAutomaticImport
              ? 'القالب متوافق بدرجة كافية. سيتم تحويل أوراق DATA فقط إلى سجلات، بينما تبقى أوراق التصنيف والقوائم والتعليمات مراجع ولا تدخل في المقارنة.'
              : 'القالب غير مؤكد بما يكفي للتحديث الآلي. تم إيقاف الاستيراد قبل المقارنة؛ يلزم تسجيل/اعتماد خريطة الحقول لهذا الإصدار.'}
          </div>
          <div className="flex flex-wrap gap-2">{templateDetection.sheets.map((sheet) => <Badge key={sheet.sheetName} variant="outline" title={sheet.reason} className={sheet.role.startsWith('data-') ? 'border-emerald-200 bg-white text-emerald-800' : sheet.role === 'unknown' ? 'border-amber-200 bg-white text-amber-800' : 'border-slate-200 bg-white text-slate-600'}>{sheet.sheetName} · {sheet.role} · {sheet.confidence}%</Badge>)}</div>
        </CardContent>
      </Card>}

'''
          s = s.replace(marker, card + marker, 1)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "openai-codex"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AccountingTransformationScopedImportPage.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: show detected Excel template profile before import"
          git push origin HEAD:agent/accounting-template-profiles-v1
