name: Run date unification patch

on:
  push:
    paths:
      - '.github/scripts/unify_dates.py'
      - '.github/workflows/run-unify-dates.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply patches
        run: python .github/scripts/unify_dates.py
      - name: Build
        run: npm ci && npm run build
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/unify_dates.py .github/workflows/run-unify-dates.yml .github/workflows/unify-date-fields.yml
          git add src
          git commit -m "Unify Hijri and Gregorian date inputs"
          git push
