name: Apply Mosques Sticky Navigation

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-mosques-sticky-navigation.mjs'
      - '.github/workflows/apply-mosques-sticky-navigation.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: |
          git pull --rebase origin main

      - name: Apply sticky navigation patch
        run: node scripts/apply-mosques-sticky-navigation.mjs

      - name: Verify build
        run: npm run build

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m "Keep mosque unit navigation sticky on desktop and mobile"
          git push origin main
