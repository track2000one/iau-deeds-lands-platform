name: Fix Mosque Site Dialog Footer

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix-mosque-site-dialog-footer.py'
      - '.github/workflows/fix-mosque-site-dialog-footer.yml'

permissions:
  contents: write

concurrency:
  group: fix-mosque-site-dialog-footer
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply patch
        run: python3 scripts/fix-mosque-site-dialog-footer.py

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend build
        run: npm run build

      - name: Commit verified frontend changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          if git diff --cached --quiet; then
            echo "No frontend source changes to commit"
            exit 0
          fi
          git commit -m "fix(mosques): keep site dialog actions visible"
          git push origin main
