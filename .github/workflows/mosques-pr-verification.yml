name: Mosque Unit PR Build Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "src/app/pages/MosquesUnitPage.tsx"
      - "src/app/components/MosqueFieldVisitsPanel.tsx"
      - "src/app/components/MosqueReportsCenter.tsx"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: mosque-unit-pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
