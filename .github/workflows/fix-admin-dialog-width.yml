name: Fix admin dialog width
on:
  push:
    paths:
      - '.github/workflows/fix-admin-dialog-width.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Fix dialog responsive width
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app/pages/AdminDashboardPage.tsx')
          s=p.read_text()
          old='className="flex max-h-[94dvh] w-[calc(100vw-1rem)] max-w-[min(96vw,1400px)] flex-col gap-0 overflow-hidden p-0 sm:w-[calc(100vw-2rem)]"'
          new='className="flex max-h-[94dvh] w-[calc(100vw-1rem)] max-w-[min(96vw,1400px)] flex-col gap-0 overflow-hidden p-0 sm:w-[calc(100vw-2rem)] sm:max-w-[min(96vw,1400px)]"'
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Verify frontend
        run: |
          npm ci
          npm run build
      - name: Commit and clean helper
        run: |
          rm .github/workflows/fix-admin-dialog-width.yml
          git config user.name "OpenAI Project Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AdminDashboardPage.tsx .github/workflows/fix-admin-dialog-width.yml
          git commit -m "fix: show full permissions matrix in edit dialog"
          git push