name: Apply Asset Group Return Hotfix

on:
  push:
    paths:
      - 'scripts/fix-asset-group-return-context.cjs'
      - 'scripts/trigger-asset-group-return-hotfix.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply return-context hotfix
        run: node scripts/fix-asset-group-return-context.cjs
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend build
        run: npm run build
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AssetsPage.tsx
          git commit -m "Fix asset group return navigation context"
          git push origin HEAD:main
