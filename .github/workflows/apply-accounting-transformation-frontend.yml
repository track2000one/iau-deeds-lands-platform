name: Apply Accounting Transformation Committee Frontend

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-accounting-transformation-frontend.cjs'
      - '.github/workflows/apply-accounting-transformation-frontend.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-accounting-transformation-frontend.cjs
      - run: npm run build
      - name: Commit frontend integration
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/permissions.ts src/app/components/PermissionMatrix.tsx src/app/routes.tsx src/app/components/Layout.tsx
          git commit -m "Integrate accounting transformation committee frontend"
          git push
