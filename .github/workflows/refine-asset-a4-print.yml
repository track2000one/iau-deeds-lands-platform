name: Refine asset A4 printing
# Keep the trigger explicit for the temporary patch workflow.
on:
  push:
    paths:
      - '.github/workflows/refine-asset-a4-print.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refine professional A4 asset card
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/pages/ViewAssetPage.tsx')
          source = path.read_text()

          start = "    printWindow.document.write(`<!doctype html>"
          end = "      </html>`);"
          start_index = source.find(start)
          if start_index < 0:
              raise SystemExit('print template start not found')
          end_index = source.find(end, start_index)
          if end_index < 0:
              raise SystemExit('print template end not found')
          end_index += len(end)

          replacement = r'''    printWindow.document.write(`<!doctype html>
      <html lang="ar" dir="rtl">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1" />
          <title>بطاقة معلومات الأصل - ${escapeHtml(asset.assetNumber)}</title>
          <style>
            @page {
              size: A4 portrait;
              margin: 9mm 10mm 10mm;
            }
            * { box-sizing: border-box; }
            html, body { margin: 0; padding: 0; background: #fff; }
            body {
              font-family: Tahoma, Arial, sans-serif;
              color: #18324a;
              font-size: 10.5px;
              line-height: 1.45;
              -webkit-print-color-adjust: exact;
              print-color-adjust: exact;
            }
            .sheet {
              width: 190mm;
              max-width: 100%;
              margin: 0 auto;
            }
            .official-header {
              display: grid;
              grid-template-columns: 1fr auto 1fr;
              align-items: center;
              gap: 8px;
              min-height: 22mm;
              padding: 4mm 5mm;
              border: 1.4px solid #153f69;
              border-radius: 4mm;
              background: linear-gradient(180deg, #f8fbfe 0%, #eef5fa 100%);
              break-inside: avoid;
            }
            .university {
              font-size: 11px;
              font-weight: 800;
              color: #153f69;
            }
            .unit {
              margin-top: 2px;
              color: #5e7487;
              font-size: 9px;
              font-weight: 700;
            }
            .document-title {
              text-align: center;
              min-width: 58mm;
            }
            .document-title h1 {
              margin: 0;
              color: #123d73;
              font-size: 18px;
              line-height: 1.2;
            }
            .document-title p {
              margin: 3px 0 0;
              font-size: 8.5px;
              color: #75889a;
            }
            .print-meta {
              text-align: left;
              direction: rtl;
              color: #667d90;
              font-size: 8px;
              line-height: 1.65;
            }
            .identity {
              display: grid;
              grid-template-columns: 1fr auto;
              gap: 10px;
              align-items: center;
              margin-top: 3mm;
              padding: 3mm 4mm;
              border: 1px solid #b8cbdc;
              border-radius: 3mm;
              background: #fff;
              break-inside: avoid;
            }
            .asset-name {
              margin: 0;
              font-size: 15px;
              font-weight: 900;
              color: #102f50;
            }
            .asset-number {
              margin-top: 2px;
              color: #667b8f;
              font-size: 8.5px;
              direction: ltr;
              text-align: right;
              overflow-wrap: anywhere;
            }
            .badge {
              display: inline-flex;
              align-items: center;
              justify-content: center;
              padding: 2mm 3mm;
              border: 1px solid #9eb5c9;
              border-radius: 99px;
              background: #f4f8fb;
              color: #244a6a;
              font-size: 9px;
              font-weight: 800;
              white-space: nowrap;
            }
            .section {
              margin-top: 3mm;
              border: 1px solid #bfd0df;
              border-radius: 3mm;
              overflow: hidden;
              background: #fff;
            }
            .section.keep { break-inside: avoid; page-break-inside: avoid; }
            .section-title {
              padding: 2.4mm 3.5mm;
              border-bottom: 1px solid #bfd0df;
              background: #edf4f9;
              color: #173f66;
              font-size: 11px;
              font-weight: 900;
            }
            .grid {
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
            }
            .field {
              min-height: 14mm;
              padding: 2.6mm 3mm;
              border-left: 1px solid #e0e8ef;
              border-bottom: 1px solid #e0e8ef;
              break-inside: avoid;
            }
            .field:nth-child(3n) { border-left: 0; }
            .field:nth-last-child(-n + 3) { border-bottom: 0; }
            .label {
              color: #73889b;
              font-size: 8px;
              margin-bottom: 1mm;
              font-weight: 700;
            }
            .value {
              color: #142f49;
              font-size: 10px;
              font-weight: 800;
              line-height: 1.55;
              overflow-wrap: anywhere;
              white-space: pre-wrap;
            }
            .additional-grid {
              display: grid;
              grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .additional-grid .field:nth-child(2n) { border-left: 0; }
            .notes-row {
              padding: 2.8mm 3.5mm;
              border-top: 1px solid #e0e8ef;
              min-height: 14mm;
              color: #243e55;
              font-size: 9.5px;
              line-height: 1.65;
              white-space: pre-wrap;
              overflow-wrap: anywhere;
            }
            .attachments-summary {
              padding: 2.5mm 3.5mm;
              color: #526d84;
              font-size: 8.5px;
              background: #fbfdff;
              border-bottom: 1px solid #e0e8ef;
            }
            .attachments {
              margin: 0;
              padding: 2.5mm 7mm 3mm 3mm;
              font-size: 8.5px;
              line-height: 1.55;
            }
            .attachments li {
              margin-bottom: 1mm;
              padding-right: 1mm;
              break-inside: avoid;
              page-break-inside: avoid;
              overflow-wrap: anywhere;
            }
            .empty { padding: 3mm 3.5mm; color: #74889a; font-size: 9px; }
            .footer {
              display: flex;
              justify-content: space-between;
              gap: 8px;
              margin-top: 3mm;
              padding-top: 2mm;
              border-top: 1px solid #ccd9e4;
              color: #7b8d9d;
              font-size: 7.5px;
              break-inside: avoid;
            }
            .no-break { break-inside: avoid; page-break-inside: avoid; }
            @media screen {
              body { background: #edf2f6; padding: 18px 0; }
              .sheet { background: #fff; padding: 10mm; box-shadow: 0 12px 40px rgba(15, 23, 42, .12); }
            }
            @media print {
              html, body { width: 210mm; }
              body { background: #fff; }
              .sheet { width: 190mm; max-width: 190mm; margin: 0 auto; }
              .section, .identity, .official-header { box-shadow: none; }
            }
          </style>
        </head>
        <body>
          <main class="sheet">
            <header class="official-header">
              <div>
                <div class="university">جامعة الإمام عبدالرحمن بن فيصل</div>
                <div class="unit">وحدة الأصول</div>
              </div>
              <div class="document-title">
                <h1>بطاقة معلومات الأصل</h1>
                <p>نسخة مخصصة للطباعة والحفظ ضمن ملف الأصل</p>
              </div>
              <div class="print-meta">
                <div>تاريخ الطباعة</div>
                <strong>${escapeHtml(printedAt)}</strong>
              </div>
            </header>

            <section class="identity">
              <div>
                <h2 class="asset-name">${escapeHtml(asset.name)}</h2>
                <div class="asset-number">${escapeHtml(asset.assetNumber)}</div>
              </div>
              <span class="badge">الحالة: ${escapeHtml(ASSET_STATUS_LABELS[asset.status] || asset.status)}</span>
            </section>

            <section class="section keep">
              <div class="section-title">البيانات الأساسية</div>
              <div class="grid">${printRows([
                ['رقم الأصل', asset.assetNumber],
                ['الباركود', asset.barcode],
                ['التصنيف', CATEGORY_LABELS[asset.category] || asset.category],
                ['الماركة', asset.brand],
                ['الموديل', asset.model],
                ['الرقم التسلسلي', asset.serialNumber],
              ])}</div>
            </section>

            <section class="section keep">
              <div class="section-title">الموقع والعهدة</div>
              <div class="grid">${printRows([
                ['الجهة / الإدارة', asset.department],
                ['المبنى', asset.building],
                ['الدور', asset.floor],
                ['الغرفة / الموقع', asset.room],
                ['صاحب العهدة', asset.custodian],
                ['حالة الأصل', ASSET_STATUS_LABELS[asset.status] || asset.status],
              ])}</div>
            </section>

            <section class="section keep">
              <div class="section-title">بيانات إضافية</div>
              <div class="additional-grid">${printRows([
                ['تاريخ الشراء', purchaseDate],
                ['قيمة الشراء', purchaseValue],
              ])}</div>
              <div class="notes-row"><strong>الملاحظات:</strong> ${escapeHtml(asset.notes)}</div>
            </section>

            <section class="section">
              <div class="section-title">المرفقات والوثائق</div>
              <div class="attachments-summary">إجمالي المرفقات المرتبطة بالأصل: <strong>${attachments.length.toLocaleString('ar-SA')}</strong></div>
              ${attachments.length
                ? `<ol class="attachments">${attachments
                    .map(
                      (attachment, index) =>
                        `<li><strong>${index + 1}.</strong> ${escapeHtml(attachment.title)} — ${escapeHtml(
                          ATTACHMENT_LABELS[String(attachment.notes || '')] || 'مرفق'
                        )}</li>`
                    )
                    .join('')}</ol>`
                : '<div class="empty">لا توجد مرفقات مرتبطة بهذا الأصل.</div>'}
            </section>

            <footer class="footer">
              <span>منصة إدارة الصكوك والأراضي — وحدة الأصول</span>
              <span>رقم الأصل: ${escapeHtml(asset.assetNumber)}</span>
            </footer>
          </main>
          <script>
            window.addEventListener('load', function () {
              setTimeout(function () {
                window.focus();
                window.print();
              }, 300);
            });
          </script>
        </body>
      </html>`);'''

          source = source[:start_index] + replacement + source[end_index:]
          path.write_text(source)
          PY
      - name: Verify frontend
        run: |
          npm ci
          npm run build
      - name: Commit and clean helper
        run: |
          git config user.name "OpenAI Project Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-asset-a4-print.yml
          git add src/app/pages/ViewAssetPage.tsx
          git commit -m "refactor: optimize asset card for A4 printing"
          git push
