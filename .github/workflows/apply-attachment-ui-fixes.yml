name: Apply Attachment UI Fixes

on:
  push:
    branches: [fix/platform-audit-core]
    paths:
      - '.github/workflows/apply-attachment-ui-fixes.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/platform-audit-core
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-attachment-ui-fixes.mjs
      - run: npm run build
      - name: Remove temporary patch files
        run: rm -f scripts/apply-attachment-ui-fixes.mjs .github/workflows/apply-attachment-ui-fixes.yml
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AddDeedPage.tsx src/app/pages/AllocatedLandsPage.tsx src/app/components/FileUploadZone.tsx scripts/apply-attachment-ui-fixes.mjs .github/workflows/apply-attachment-ui-fixes.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix protected uploads and allocated land options"
            git push origin fix/platform-audit-core
          fi
