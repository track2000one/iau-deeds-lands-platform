# Temporary workflow: refines AssetCyclesPage colors, verifies build, then removes itself.
name: Refine asset cycle colors
on:
  push:
    paths:
      - '.github/workflows/refine-asset-cycle-colors.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refine cycle page palette
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/app/pages/AssetCyclesPage.tsx')
          s = p.read_text(encoding='utf-8')

          replacements = [
            (
              '<Card className="overflow-hidden rounded-[32px] border-sky-900/20 bg-gradient-to-l from-[#10243b] via-[#153654] to-[#0b4a67] text-white shadow-[0_26px_75px_rgba(15,23,42,.2)]">',
              '<Card className="overflow-hidden rounded-[32px] border text-[color:var(--asset-dashboard-text,#fff)]" style={{ background: \'var(--asset-dashboard-overlay, linear-gradient(135deg,#23364a 0%,#122941 44%,#0a1f36 100%))\', borderColor: \'var(--asset-dashboard-border,rgba(255,255,255,.20))\', boxShadow: \'0 26px 75px color-mix(in srgb, var(--asset-dashboard-base,#10243b) 32%, transparent)\' }}>'
            ),
            (
              '<Badge className="border-white/15 bg-white/10 text-white"><History className="ml-1 h-3.5 w-3.5" />سجل تاريخي كامل</Badge><Badge className="border-emerald-300/25 bg-emerald-300/15 text-emerald-50"><ShieldCheck className="ml-1 h-3.5 w-3.5" />لا حذف للبيانات القديمة</Badge>',
              '<Badge className="border-[color:var(--asset-dashboard-inner-border,rgba(255,255,255,.12))] bg-[var(--asset-dashboard-soft,rgba(255,255,255,.10))] text-[color:var(--asset-dashboard-text,#fff)]"><History className="ml-1 h-3.5 w-3.5" />سجل تاريخي كامل</Badge><Badge className="border-emerald-300/30 bg-emerald-300/15 text-[color:var(--asset-dashboard-text,#fff)]"><ShieldCheck className="ml-1 h-3.5 w-3.5 text-emerald-300" />لا حذف للبيانات القديمة</Badge>'
            ),
            (
              '<p className="mt-2 max-w-3xl text-sm leading-7 text-slate-200">',
              '<p className="mt-2 max-w-3xl text-sm leading-7 text-[color:var(--asset-dashboard-muted,#cbd5e1)]">'
            ),
            (
              '<Button className="bg-cyan-400 text-slate-950 hover:bg-cyan-300" onClick={() => openCycle ? navigate(`/assets/import?cycleId=${openCycle.id}`) : setShowCreate(true)}>',
              '<Button className="border-0 text-white shadow-lg hover:brightness-110" style={{ background: \'var(--asset-dashboard-button,#123d73)\' }} onClick={() => openCycle ? navigate(`/assets/import?cycleId=${openCycle.id}`) : setShowCreate(true)}>'
            ),
            (
              '<Button variant="outline" className="border-white/20 bg-white/10 text-white hover:bg-white/15 hover:text-white" onClick={() => navigate(\'/assets\')}>',
              '<Button variant="outline" className="border-[color:var(--asset-dashboard-inner-border,rgba(255,255,255,.12))] bg-[var(--asset-dashboard-soft,rgba(255,255,255,.10))] text-[color:var(--asset-dashboard-text,#fff)] hover:bg-[var(--asset-dashboard-soft,rgba(255,255,255,.10))] hover:text-[color:var(--asset-dashboard-text,#fff)]" onClick={() => navigate(\'/assets\')}>'
            ),
            (
              '<div className="mt-6 rounded-2xl border border-white/15 bg-white/10 p-4"><div className="text-xs font-bold text-slate-300">الدورة الحالية المعتمدة</div><div className="mt-1 text-lg font-black">#{currentCycle.cycleNumber} — {currentCycle.name}</div><div className="mt-2 text-xs text-slate-300">',
              '<div className="mt-6 rounded-2xl border p-4" style={{ background: \'var(--asset-dashboard-panel-strong,rgba(255,255,255,.105))\', borderColor: \'var(--asset-dashboard-inner-border,rgba(255,255,255,.12))\' }}><div className="text-xs font-bold text-[color:var(--asset-dashboard-muted,#cbd5e1)]">الدورة الحالية المعتمدة</div><div className="mt-1 text-lg font-black">#{currentCycle.cycleNumber} — {currentCycle.name}</div><div className="mt-2 text-xs text-[color:var(--asset-dashboard-muted,#cbd5e1)]">'
            ),
            (
              '<Card className="rounded-[28px] border-sky-200 bg-white/90">',
              '<Card className="rounded-[28px] border-border/80 bg-card/95 shadow-sm">'
            ),
            (
              "className={`rounded-[26px] bg-white/90 shadow-sm ${cycle.isCurrent ? 'border-emerald-300' : 'border-slate-200'}`}",
              "className={`rounded-[26px] bg-card/95 text-card-foreground shadow-sm ${cycle.isCurrent ? 'border-emerald-400/70 ring-1 ring-emerald-300/20' : 'border-border/80'}`}"
            ),
            (
              '<div className="rounded-xl bg-emerald-50 p-2"><b>{comp.new.toLocaleString(\'ar-SA\')}</b><br />جديد</div><div className="rounded-xl bg-amber-50 p-2"><b>{comp.modified.toLocaleString(\'ar-SA\')}</b><br />معدل</div><div className="rounded-xl bg-sky-50 p-2"><b>{comp.unchanged.toLocaleString(\'ar-SA\')}</b><br />ثابت</div><div className="rounded-xl bg-rose-50 p-2"><b>{comp.removed.toLocaleString(\'ar-SA\')}</b><br />لم يظهر</div>',
              '<div className="rounded-xl border border-emerald-200/80 bg-emerald-50/70 p-2 text-emerald-900 dark:border-emerald-700/50 dark:bg-emerald-950/30 dark:text-emerald-200"><b>{comp.new.toLocaleString(\'ar-SA\')}</b><br />جديد</div><div className="rounded-xl border border-amber-200/80 bg-amber-50/70 p-2 text-amber-900 dark:border-amber-700/50 dark:bg-amber-950/30 dark:text-amber-200"><b>{comp.modified.toLocaleString(\'ar-SA\')}</b><br />معدل</div><div className="rounded-xl border border-sky-200/80 bg-sky-50/70 p-2 text-sky-900 dark:border-sky-700/50 dark:bg-sky-950/30 dark:text-sky-200"><b>{comp.unchanged.toLocaleString(\'ar-SA\')}</b><br />ثابت</div><div className="rounded-xl border border-rose-200/80 bg-rose-50/70 p-2 text-rose-900 dark:border-rose-700/50 dark:bg-rose-950/30 dark:text-rose-200"><b>{comp.removed.toLocaleString(\'ar-SA\')}</b><br />لم يظهر</div>'
            ),
            (
              '<Card className="rounded-[28px] border-sky-200 bg-white/95">',
              '<Card className="rounded-[28px] border-border/80 bg-card/95 text-card-foreground">'
            ),
            (
              'className="h-10 rounded-xl border bg-white px-3 text-sm"',
              'className="h-10 rounded-xl border border-input bg-background px-3 text-sm text-foreground"'
            ),
          ]

          for old, new in replacements:
            if old not in s:
              raise SystemExit(f'Expected source fragment not found:\n{old[:180]}')
            s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
      - name: Verify frontend
        run: |
          npm ci
          npm run build
      - name: Commit refinement and cleanup
        run: |
          rm .github/workflows/refine-asset-cycle-colors.yml
          git config user.name "OpenAI Project Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harmonize asset cycle page colors"
          git push
