name: Sync PDF Lib Lockfile

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - '.github/workflows/sync-pdf-lib-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install pdf-lib@1.17.1 --save
      - name: Commit lockfile
        run: |
          if git diff --quiet package.json package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "Sync pdf-lib dependency lockfile"
          git push
