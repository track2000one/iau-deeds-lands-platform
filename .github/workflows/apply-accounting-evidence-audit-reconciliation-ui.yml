name: Apply Accounting Evidence Audit Reconciliation UI

on:
  push:
    branches: [feat/accounting-evidence-audit-reconciliation-ui]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/accounting-evidence-audit-reconciliation-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply reconciliation UI
        run: node scripts/apply-accounting-evidence-audit-reconciliation-ui.mjs
      - name: Build frontend
        run: npm run build
      - name: Verify integration markers
        run: |
          grep -q "مطابقة قاعدة البيانات الفعلية" src/app/pages/AccountingPropertyEvidenceAuditPage.tsx
          grep -q "getAccountingEvidenceAuditReconciliation" src/app/pages/AccountingPropertyEvidenceAuditPage.tsx
          grep -q "backfillAccountingEvidenceAuditMissingMirrors" src/app/pages/AccountingPropertyEvidenceAuditPage.tsx
      - name: Remove temporary automation files
        run: |
          rm scripts/apply-accounting-evidence-audit-reconciliation-ui.mjs
          rm .github/workflows/apply-accounting-evidence-audit-reconciliation-ui.yml
      - name: Commit integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/accountingEvidenceAuditReconciliation.ts src/app/pages/AccountingPropertyEvidenceAuditPage.tsx .github/workflows scripts
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Integrate evidence audit reconciliation UI"
            git push origin HEAD:feat/accounting-evidence-audit-reconciliation-ui
          fi
