name: Apply Quran Live Full Cards

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-quran-live-full-cards.py'
      - '.github/workflows/apply-quran-live-full-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Apply full Quran live search cards
        run: python3 scripts/apply-quran-live-full-cards.py

      - name: Verify build
        run: npm run build

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m "Show full Quran cards in live search"
          git push origin main
