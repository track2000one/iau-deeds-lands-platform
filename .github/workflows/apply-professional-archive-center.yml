name: Apply Professional Archive Center

on:
  push:
    paths:
      - '.github/workflows/apply-professional-archive-center.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: git pull --ff-only origin main

      - name: Apply professional archive patch
        run: node scripts/apply-professional-archive-center.mjs

      - name: Verify build
        run: npm run build

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/ArchivePage.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "Professionalize archive workflow and reports"
          git push origin main
