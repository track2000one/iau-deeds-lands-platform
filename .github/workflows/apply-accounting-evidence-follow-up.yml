name: Apply Accounting Evidence Follow Up

on:
  push:
    branches:
      - feat/accounting-evidence-follow-up

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/accounting-evidence-follow-up
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 scripts/apply-accounting-evidence-follow-up.py
      - run: npm run build
      - name: Remove temporary automation files
        run: |
          rm scripts/apply-accounting-evidence-follow-up.py
          rm .github/workflows/apply-accounting-evidence-follow-up.yml
      - name: Commit integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Integrate evidence follow-up task management"
            git push origin HEAD:feat/accounting-evidence-follow-up
          fi
