name: Fix complete English UI on home and shell

on:
  push:
    paths:
      - '.github/workflows/fix-full-english-home-shell.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply bilingual UI and locale-aware numbers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          home = Path('src/app/pages/HomePage.tsx')
          text = home.read_text(encoding='utf-8')

          text = text.replace("  const { t } = useTranslation();", "  const { t, i18n } = useTranslation();\n  const isArabic = i18n.language === 'ar';\n  const locale = isArabic ? 'ar-SA' : 'en-US';\n  const ui = (ar: string, en: string) => (isArabic ? ar : en);\n  const formatNumber = (value: number) => new Intl.NumberFormat(locale).format(value);")
          text = text.replace("      totalAreaText: totalArea.toLocaleString(),", "      totalAreaText: new Intl.NumberFormat(i18n.language === 'ar' ? 'ar-SA' : 'en-US').format(totalArea),")
          text = text.replace("  }, [deeds]);", "  }, [deeds, i18n.language]);", 1)

          text = text.replace("value: stats.total.toLocaleString(),", "value: formatNumber(stats.total),")
          text = text.replace("value: stats.planned.toLocaleString(),", "value: formatNumber(stats.planned),")
          text = text.replace("value: stats.unplanned.toLocaleString(),", "value: formatNumber(stats.unplanned),")
          text = text.replace("sub: `${percent(stats.unplanned, stats.total)}% غير مخططة`,", "sub: `${percent(stats.unplanned, stats.total)}% ${ui('غير مخططة', 'Unplanned')}`, ")
          text = text.replace("label: 'إجمالي مساحة الصكوك',", "label: ui('إجمالي مساحة الصكوك', 'Total Deed Area'),")

          replacements = {
            "{ id: 'add-deed', path: '/deeds/new', icon: PlusCircle, label: 'إصدار صك جديد', sub: 'إضافة صك إلكتروني' }": "{ id: 'add-deed', path: '/deeds/new', icon: PlusCircle, label: ui('إصدار صك جديد', 'Create New Deed'), sub: ui('إضافة صك إلكتروني', 'Add an electronic deed') }",
            "{ id: 'allocated-lands', path: '/lands/allocated', icon: MapPin, label: 'تسجيل أرض', sub: 'إضافة أرض جديدة' }": "{ id: 'allocated-lands', path: '/lands/allocated', icon: MapPin, label: ui('تسجيل أرض', 'Register Land'), sub: ui('إضافة أرض جديدة', 'Add new land') }",
            "{ id: 'archive', path: '/archive', icon: UploadCloud, label: 'رفع مستند', sub: 'حفظ الملفات والأرشفة' }": "{ id: 'archive', path: '/archive', icon: UploadCloud, label: ui('رفع مستند', 'Upload Document'), sub: ui('حفظ الملفات والأرشفة', 'Save files and archive') }",
            "{ id: 'search', path: '/search', icon: Search, label: 'بحث متقدم', sub: 'البحث في السجلات' }": "{ id: 'search', path: '/search', icon: Search, label: ui('بحث متقدم', 'Advanced Search'), sub: ui('البحث في السجلات', 'Search records') }",
            "{ id: 'reports', path: '/reports', icon: BarChart3, label: 'التقارير', sub: 'إحصاءات وطباعة' }": "{ id: 'reports', path: '/reports', icon: BarChart3, label: ui('التقارير', 'Reports'), sub: ui('إحصاءات وطباعة', 'Statistics and printing') }",
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          jsx = {
            '<h2 className="text-xl font-bold">مرحباً بك في </h2>': '<h2 className="text-xl font-bold">{ui(\'مرحباً بك في\', \'Welcome to\')}</h2>',
            '<h2 className="text-xl font-bold">إدارة أوقاف وأملاك الجامعة </h2>': '<h2 className="text-xl font-bold">{ui(\'إدارة أوقاف وأملاك الجامعة\', \'University Endowments and Properties Administration\')}</h2>',
            '<CardTitle>إجراء سريع</CardTitle>': '<CardTitle>{ui(\'إجراء سريع\', \'Quick Action\')}</CardTitle>',
            '<CardDescription>الوصول السريع لأهم العمليات</CardDescription>': '<CardDescription>{ui(\'الوصول السريع لأهم العمليات\', \'Quick access to key operations\')}</CardDescription>',
            'إنشاء معاملة جديدة': "{ui('إنشاء معاملة جديدة', 'Create New Transaction')}",
            '<CardTitle>معلومات النظام</CardTitle>': '<CardTitle>{ui(\'معلومات النظام\', \'System Information\')}</CardTitle>',
            '<span className="text-sm text-muted-foreground">إصدار المنصة</span>': '<span className="text-sm text-muted-foreground">{ui(\'إصدار المنصة\', \'Platform Version\')}</span>',
            '<span className="text-sm text-muted-foreground">وقت التشغيل</span>': '<span className="text-sm text-muted-foreground">{ui(\'وقت التشغيل\', \'Uptime\')}</span>',
            '<span className="font-mono">10.0 يوم</span>': '<span className="font-mono">{ui(\'١٠٫٠ يوم\', \'10.0 days\')}</span>',
            '<span className="text-sm text-muted-foreground">حالة النظام</span>': '<span className="text-sm text-muted-foreground">{ui(\'حالة النظام\', \'System Status\')}</span>',
            '<Badge variant="secondary">يعمل بكفاءة</Badge>': '<Badge variant="secondary">{ui(\'يعمل بكفاءة\', \'Operational\')}</Badge>',
            '<span>نظرة عامة على المنصة</span>': '<span>{ui(\'نظرة عامة على المنصة\', \'Platform Overview\')}</span>',
            '<CardDescription>ملخص شامل لأداء المنصة والعمليات الرئيسية</CardDescription>': '<CardDescription>{ui(\'ملخص شامل لأداء المنصة والعمليات الرئيسية\', \'A comprehensive summary of platform performance and core operations\')}</CardDescription>',
            '<p className="text-xs text-muted-foreground">إجمالي السجلات</p>': '<p className="text-xs text-muted-foreground">{ui(\'إجمالي السجلات\', \'Total Records\')}</p>',
            '<p className="text-xs text-muted-foreground">الصكوك</p>': '<p className="text-xs text-muted-foreground">{ui(\'الصكوك\', \'Deeds\')}</p>',
            '<p className="text-xs text-muted-foreground">الأراضي</p>': '<p className="text-xs text-muted-foreground">{ui(\'الأراضي\', \'Lands\')}</p>',
            '<p className="text-xs text-muted-foreground">المباني</p>': '<p className="text-xs text-muted-foreground">{ui(\'المباني\', \'Buildings\')}</p>',
            '<CardDescription>العمليات الشائعة للوصول السريع</CardDescription>': '<CardDescription>{ui(\'العمليات الشائعة للوصول السريع\', \'Common operations for quick access\')}</CardDescription>',
            '<CardDescription>آخر الصكوك المضافة للنظام</CardDescription>': '<CardDescription>{ui(\'آخر الصكوك المضافة للنظام\', \'Latest deeds added to the system\')}</CardDescription>',
            '<p>لا توجد صكوك</p>': '<p>{ui(\'لا توجد صكوك\', \'No deeds found\')}</p>',
            '<Badge variant="secondary">مخططة</Badge>': '<Badge variant="secondary">{ui(\'مخططة\', \'Planned\')}</Badge>',
            '<CardTitle>الأمان والموثوقية</CardTitle>': '<CardTitle>{ui(\'الأمان والموثوقية\', \'Security and Reliability\')}</CardTitle>',
            '<CardDescription>مستوى أمان متقدم</CardDescription>': '<CardDescription>{ui(\'مستوى أمان متقدم\', \'Advanced security level\')}</CardDescription>',
            '<p className="text-sm text-muted-foreground">مستوى الأمان</p>': '<p className="text-sm text-muted-foreground">{ui(\'مستوى الأمان\', \'Security Level\')}</p>',
            'التنبيهات والإشعارات': "{ui('التنبيهات والإشعارات', 'Alerts and Notifications')}",
            '<CardDescription>آخر التحديثات المهمة على المنصة</CardDescription>': '<CardDescription>{ui(\'آخر التحديثات المهمة على المنصة\', \'Latest important platform updates\')}</CardDescription>',
            '<p className="font-bold">تحديث جديد</p>': '<p className="font-bold">{ui(\'تحديث جديد\', \'New Update\')}</p>',
            '<p className="text-sm text-muted-foreground mt-1">تم تحسين واجهة المنصة المستقبلية.</p>': '<p className="text-sm text-muted-foreground mt-1">{ui(\'تم تحسين واجهة المنصة المستقبلية.\', \'The platform interface has been improved.\')}</p>',
            '<p className="font-bold">معاملة بحاجة لمراجعة</p>': '<p className="font-bold">{ui(\'معاملة بحاجة لمراجعة\', \'Transaction Requires Review\')}</p>',
            '<p className="text-sm text-muted-foreground mt-1">راجع السجلات الأخيرة عند الحاجة.</p>': '<p className="text-sm text-muted-foreground mt-1">{ui(\'راجع السجلات الأخيرة عند الحاجة.\', \'Review the latest records when needed.\')}</p>',
            '<p className="font-bold">رفع مخطط</p>': '<p className="font-bold">{ui(\'رفع مخطط\', \'Upload Plan\')}</p>',
            '<p className="text-sm text-muted-foreground mt-1">يمكن رفع المخططات من صفحة الأرشفة.</p>': '<p className="text-sm text-muted-foreground mt-1">{ui(\'يمكن رفع المخططات من صفحة الأرشفة.\', \'Plans can be uploaded from the Archive page.\')}</p>',
          }
          for old, new in jsx.items():
              text = text.replace(old, new)

          text = text.replace('{dataStats.totalRecords}', '{formatNumber(dataStats.totalRecords)}')
          text = text.replace('{dataStats.totalDeeds}', '{formatNumber(dataStats.totalDeeds)}')
          text = text.replace('{dataStats.totalAllocatedLands + dataStats.totalDeliveredLands +\n                      dataStats.totalLeasedLandsOut + dataStats.totalLeasedLandsIn}', '{formatNumber(dataStats.totalAllocatedLands + dataStats.totalDeliveredLands +\n                      dataStats.totalLeasedLandsOut + dataStats.totalLeasedLandsIn)}')
          text = text.replace('{dataStats.totalLeasedBuildingsOut + dataStats.totalLeasedBuildingsIn}', '{formatNumber(dataStats.totalLeasedBuildingsOut + dataStats.totalLeasedBuildingsIn)}')
          text = text.replace('{safeNumber(deed.area).toLocaleString()} {t(\'deed.sqm\')}', '{formatNumber(safeNumber(deed.area))} {t(\'deed.sqm\')}')
          text = text.replace("new Date(deed.createdAt).toLocaleDateString('ar-SA')", "new Date(deed.createdAt).toLocaleDateString(locale)")
          text = text.replace('className="text-right"', 'className={isArabic ? \'text-right\' : \'text-left\'}')

          home.write_text(text, encoding='utf-8')

          layout = Path('src/app/components/Layout.tsx')
          text = layout.read_text(encoding='utf-8')
          text = text.replace("  const isRTL = i18n.language === 'ar';", "  const isRTL = i18n.language === 'ar';\n  const ui = (ar: string, en: string) => (isRTL ? ar : en);\n  const locale = isRTL ? 'ar-SA' : 'en-US';")
          text = text.replace("label: 'معاينة أرض أو موقع'", "label: ui('معاينة أرض أو موقع', 'Land or Site Inspection')")
          text = text.replace("label: 'متابعة العقود'", "label: ui('متابعة العقود', 'Contract Follow-up')")
          text = text.replace("label: 'وحدة الأصول'", "label: ui('وحدة الأصول', 'Assets Unit')")
          text = text.replace("label: 'سجل العمليات'", "label: ui('سجل العمليات', 'Audit Log')")
          text = text.replace("label: 'الأرشفة'", "label: ui('الأرشفة', 'Archive')")
          text = text.replace("label: 'المظهر'", "label: ui('المظهر', 'Appearance')")
          text = text.replace('title="الحساب" aria-label="الحساب"', "title={ui('الحساب', 'Account')} aria-label={ui('الحساب', 'Account')}")
          text = text.replace('title="تنبيهات العقود" aria-label="تنبيهات العقود"', "title={ui('تنبيهات العقود', 'Contract Alerts')} aria-label={ui('تنبيهات العقود', 'Contract Alerts')}")
          text = text.replace('title="إنشاء رسالة بريد" aria-label="إنشاء رسالة بريد"', "title={ui('إنشاء رسالة بريد', 'Compose Email')} aria-label={ui('إنشاء رسالة بريد', 'Compose Email')}")
          text = text.replace('title="تبديل اللغة" aria-label="تبديل اللغة"', "title={ui('تبديل اللغة', 'Switch Language')} aria-label={ui('تبديل اللغة', 'Switch Language')}")
          text = text.replace("encodeURIComponent('منصة إدارة الأصول والأملاك والأوقاف الجامعية')", "encodeURIComponent(ui('منصة إدارة الأصول والأملاك والأوقاف الجامعية', 'University Assets, Properties and Endowments Management Platform'))")
          text = text.replace("now.toLocaleDateString('ar-SA-u-nu-latn')", "now.toLocaleDateString(locale)")
          text = text.replace("now.toLocaleTimeString('ar-SA-u-nu-latn', { hour: '2-digit', minute: '2-digit' })", "now.toLocaleTimeString(locale, { hour: '2-digit', minute: '2-digit' })")
          text = text.replace('<p className="text-xs opacity-70">مستخدم المنصة</p>', '<p className="text-xs opacity-70">{ui(\'مستخدم المنصة\', \'Platform User\')}</p>')
          text = text.replace("{i18n.language === 'ar' ? 'EN' : 'ع'}", "{i18n.language === 'ar' ? 'EN' : 'AR'}")
          layout.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/fix-full-english-home-shell.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/HomePage.tsx src/app/components/Layout.tsx .github/workflows/fix-full-english-home-shell.yml
          git commit -m "Complete English localization for home and navigation shell"
          git push
