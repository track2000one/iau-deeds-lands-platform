name: Apply full neumorphic platform styling

on:
  push:
    paths:
      - '.github/workflows/apply-full-neumorphic-platform.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply platform-wide neumorphic style
        run: python scripts/apply-full-neumorphic-platform.py

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend build
        run: npm run build

      - name: Commit verified styling and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/apply-full-neumorphic-platform.yml
          rm -f scripts/apply-full-neumorphic-platform.py
          git config user.name "OpenAI Project Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/Layout.tsx src/app/components/ThemeInitializer.tsx .github/workflows/apply-full-neumorphic-platform.yml scripts/apply-full-neumorphic-platform.py
          git diff --cached --check
          git commit -m "feat: apply full neumorphic platform styling"
          git push origin HEAD:main
