name: Apply Field Visit Offline First

on:
  push:
    paths:
      - 'scripts/apply-field-visit-offline-first.mjs'
      - 'src/app/utils/fieldVisitOffline.ts'
      - '.github/workflows/apply-field-visit-offline-first.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync latest main
        run: |
          git fetch origin main
          git checkout main
          git pull --ff-only origin main

      - name: Apply offline-first field visit patch
        run: node scripts/apply-field-visit-offline-first.mjs

      - name: Verify build
        run: npm run build

      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/MosqueFieldVisitsPanel.tsx src/app/utils/fieldVisitOffline.ts
          git commit -m "Add offline-first autosave to field visits"
          git push origin main
