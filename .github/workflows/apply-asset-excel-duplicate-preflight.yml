name: Apply Asset Excel Duplicate Preflight

on:
  push:
    paths:
      - 'scripts/fix-asset-excel-duplicate-preflight.cjs'
      - 'scripts/trigger-asset-excel-duplicate-preflight.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Excel duplicate preflight patch
        run: node scripts/fix-asset-excel-duplicate-preflight.cjs
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend build
        run: npm run build
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/utils/assetExcelImport.ts src/app/pages/AssetExcelImportPage.tsx
          git commit -m "Prevent repeated Excel asset imports"
          git push origin HEAD:main
