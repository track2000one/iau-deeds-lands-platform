name: Apply Mosque Header Actions Layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mosque-hero-actions-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply header action layout
        run: python scripts/apply_mosque_header_actions.py

      - name: Build frontend
        run: npm run build

      - name: Commit source change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mosque-hero-actions-layout.yml
          git rm scripts/apply_mosque_header_actions.py
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m "Improve mosque unit header actions layout"
          git push origin HEAD:main
