name: Fix deed update and verify notifications

# Trigger this helper only when the helper itself changes.
on:
  push:
    paths:
      - '.github/workflows/fix-deed-update-and-verify-notifications.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Make deed API updates complete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/context/DeedContext.tsx')
          s = p.read_text()
          old = """        const savedDeed = await api.updateDeed<Deed>(id, {
          ...sanitizedData,
          area:
            sanitizedData.area !== undefined && sanitizedData.area !== null
              ? Number(sanitizedData.area)
              : sanitizedData.area,
        });
"""
          new = """        // The backend PUT endpoint validates a complete deed payload. Merge the
        // current record with the edited fields so partial UI updates (including
        // attachment-only updates) never omit required fields such as deedNumber.
        const apiPayload: Partial<Deed> = {
          ...currentDeed,
          ...sanitizedData,
          area:
            sanitizedData.area !== undefined && sanitizedData.area !== null
              ? Number(sanitizedData.area)
              : Number(currentDeed.area || 0),
        };

        const savedDeed = await api.updateDeed<Deed>(id, apiPayload);
"""
          if old not in s:
              raise SystemExit('DeedContext update marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY

      - name: Verify frontend
        run: |
          npm ci
          npm run build

      - name: Commit fix and cleanup
        run: |
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/fix-deed-update-and-verify-notifications.yml
          git add src/context/DeedContext.tsx .github/workflows/fix-deed-update-and-verify-notifications.yml
          git commit -m 'fix: preserve required deed fields during updates'
          git push origin main
