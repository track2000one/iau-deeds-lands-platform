name: Redesign Mosques Unit Forms

on:
  push:
    branches: [main]
    paths:
      - 'scripts/redesign-mosques-unit-forms.cjs'
      - '.github/workflows/redesign-mosques-unit-forms.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/redesign-mosques-unit-forms.cjs
      - run: npm run build
      - name: Commit redesigned mosque forms
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m "Redesign mosque unit forms like deed entry"
          git push
