name: Apply Professional Excel Reports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-professional-excel.yml'
      - 'scripts/apply-professional-excel.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install ExcelJS
        run: npm install exceljs@4.4.0 --save
      - name: Apply professional Excel patch
        run: python3 scripts/apply-professional-excel.py
      - name: Build frontend
        run: npm run build
      - name: Remove temporary patch files
        run: rm -f scripts/apply-professional-excel.py .github/workflows/apply-professional-excel.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/app/utils/excelReport.ts src/app/pages/MosquesUnitPage.tsx src/app/components/MosqueFieldVisitsPanel.tsx scripts/apply-professional-excel.py .github/workflows/apply-professional-excel.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Style mosque Excel reports like PDF"
            git push origin main
          fi
