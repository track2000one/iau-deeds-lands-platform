name: Apply Quran Context Site Lock

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-quran-context-site-lock.mjs'
      - '.github/workflows/apply-quran-context-site-lock.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Sync latest main
        run: git pull --ff-only origin main
      - name: Apply contextual site UX patch
        run: node scripts/apply-quran-context-site-lock.mjs
      - name: Verify build
        run: npm run build
      - name: Commit and push changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m "Lock Quran movement to selected mosque or prayer room"
          git push origin main
