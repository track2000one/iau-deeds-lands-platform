name: Apply Accounting Supporting Documents

on:
  push:
    branches: [feat/accounting-supporting-documents]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[supporting-docs applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/accounting-supporting-documents
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply source patch
        run: python scripts/patch-accounting-supporting-documents.py
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Verify document mapping rules
        run: |
          grep -q "type === 'building' && field.c === 'AU'" src/utils/officialAccountingTransformationExcel.ts
          grep -q "type === 'land' && field.c === 'AI'" src/utils/officialAccountingTransformationExcel.ts
          grep -q "Not Available" src/utils/accountingSupportingDocuments.ts
          grep -q "المرفقات المصنفة" src/app/pages/AccountingTransformationFormPage.tsx
      - name: Commit generated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AccountingTransformationFormPage.tsx src/utils/officialAccountingTransformationExcel.ts
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "feat: classify supporting documents for accounting Excel [supporting-docs applied]"
            git push origin HEAD:feat/accounting-supporting-documents
          fi
