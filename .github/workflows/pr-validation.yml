name: PR validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Verify mosque needs reports (all types)
        run: node scripts/check-mosque-need-reports.mjs
      - name: Build frontend
        run: npm run build
