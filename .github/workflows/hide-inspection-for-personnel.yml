name: Hide inspection button for mosque personnel

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hide-inspection-for-personnel.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply visibility change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/app/pages/MosquesUnitPage.tsx')
          text = path.read_text(encoding='utf-8')
          old = '''            <Button variant="outline" className={button3d} onClick={() => window.open('https://inspection-vna1.vercel.app/', '_blank', 'noopener,noreferrer')}><ClipboardList className="ml-2 h-4 w-4" />نظام المعاينة</Button>'''
          new = '''            {role !== 'personnel' && <Button variant="outline" className={button3d} onClick={() => window.open('https://inspection-vna1.vercel.app/', '_blank', 'noopener,noreferrer')}><ClipboardList className="ml-2 h-4 w-4" />نظام المعاينة</Button>}'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one inspection button match, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build verification
        run: npm run build

      - name: Commit verified change and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/hide-inspection-for-personnel.yml
          git config user.name "OpenAI Project Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx .github/workflows/hide-inspection-for-personnel.yml
          git commit -m "fix: hide inspection system from mosque personnel"
          git push origin main
