name: Apply Mosque Print PDF Controls

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-mosque-print-pdf-controls.py'
      - '.github/workflows/apply-mosque-print-pdf-controls.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply patch
        run: python scripts/apply-mosque-print-pdf-controls.py

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend build
        run: npm run build

      - name: Commit verified source change
        shell: bash
        run: |
          if git diff --quiet -- src/app/pages/MosquesUnitPage.tsx; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "track2000one"
          git config user.email "track2000one@gmail.com"
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m "feat(mosques): add card and table print PDF controls"
          git push
