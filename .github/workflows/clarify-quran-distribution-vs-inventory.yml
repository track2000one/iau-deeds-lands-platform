name: Clarify Quran Distribution vs Inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/clarify-quran-distribution-vs-inventory.py'
      - '.github/workflows/clarify-quran-distribution-vs-inventory.yml'

permissions:
  contents: write

concurrency:
  group: clarify-quran-distribution-vs-inventory
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply patch
        run: python3 scripts/clarify-quran-distribution-vs-inventory.py

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend build
        run: npm run build

      - name: Commit verified frontend changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          if git diff --cached --quiet; then
            echo "No frontend source changes to commit"
            exit 0
          fi
          git commit -m "fix(mosques): separate Quran distribution from physical inventory"
          git push origin main
