name: Compact asset report print v2
on:
  push:
    paths:
      - 'scripts/compact-asset-report-print-v2.mjs'
      - '.github/workflows/compact-asset-report-print-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/compact-asset-report-print-v2.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AssetReportsPage.tsx
          git diff --cached --quiet || git commit -m "Further compact asset report print layout"
          git push
