name: Apply accounting cycle reports

on:
  push:
    paths:
      - '.github/workflows/apply-accounting-cycle-reports.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply cycle report patch
        run: python scripts/apply-accounting-cycle-reports.py
      - name: Verify frontend
        run: |
          npm ci
          npm run build
      - name: Commit cycle report support
        run: |
          git config user.name 'OpenAI Project Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/pages/AccountingTransformationReportsPage.tsx src/app/pages/AccountingTransformationCyclesPage.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add historical cycle reports for accounting transformation'
          git push origin main
