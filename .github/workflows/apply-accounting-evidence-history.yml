name: Apply Accounting Evidence History

on:
  push:
    branches:
      - feat/accounting-evidence-history
    paths:
      - scripts/apply-accounting-evidence-history.py
      - src/app/config/accountingPropertyEvidenceHistory.ts
      - .github/workflows/apply-accounting-evidence-history.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 scripts/apply-accounting-evidence-history.py
      - run: npm run build
      - name: Remove temporary automation files
        run: |
          git rm -f scripts/apply-accounting-evidence-history.py .github/workflows/apply-accounting-evidence-history.yml
      - name: Commit integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "4189824+github-actions[bot]@users.noreply.github.com"
          git add src/app/config/accountingPropertyEvidenceHistory.ts src/app/pages/AccountingPropertyControlIndicatorsPage.tsx src/app/pages/AccountingPropertyEvidenceDashboardPage.tsx docs/accounting-evidence-history.md
          git commit -m "Integrate accounting evidence history timeline"
          git push
