name: Apply mosque user visibility boundary

on:
  push:
    paths:
      - '.github/workflows/apply-mosque-user-scope-20260818.yml'

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Restrict mosque leadership to mosque personnel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/pages/MosquesUnitPage.tsx')
          text = path.read_text(encoding='utf-8')

          old = """      if (me.role === 'head' || me.role === 'supervisor') {
        const [requestRows, ticketRows, leaveRows, personRows, staffRows] = await Promise.all([
          mosqueApi.requests(), mosqueApi.tickets(), mosqueApi.leaves(), mosqueApi.personnel(), mosqueApi.staffDirectory(),
        ]);
        setRequests(requestRows);
        setTickets(ticketRows);
        setLeaves(leaveRows);
        setPersonnel(personRows);
        setStaffUsers(staffRows);
        try { setJobs(await mosqueApi.jobs()); } catch { setJobs([]); }
        if (me.role === 'head') {
          try {
            const rows = await mosqueApi.assignments();
            setAssignments(rows);
            setAssignmentDrafts(Object.fromEntries(rows.map((item) => [item.userId, { role: item.role, siteId: item.siteId || '', personnelRole: item.personnelRole || 'imam' }])));
          } catch { setAssignments([]); setAssignmentDrafts({}); }
        } else {
          setAssignments([]);
          setAssignmentDrafts({});
        }
"""
          new = """      if (me.role === 'head' || me.role === 'supervisor') {
        const [requestRows, ticketRows, leaveRows, personRows, staffRows] = await Promise.all([
          mosqueApi.requests(),
          mosqueApi.tickets(),
          mosqueApi.leaves(),
          mosqueApi.personnel(),
          isAdmin ? mosqueApi.staffDirectory() : Promise.resolve([] as MosqueStaffUser[]),
        ]);
        setRequests(requestRows);
        setTickets(ticketRows);
        setLeaves(leaveRows);
        setPersonnel(personRows.filter((item) => ['imam', 'muezzin', 'khateeb', 'collaborating_khateeb'].includes(item.role)));
        setStaffUsers(staffRows);
        try { setJobs(await mosqueApi.jobs()); } catch { setJobs([]); }
        if (isAdmin) {
          try {
            const rows = await mosqueApi.assignments();
            setAssignments(rows);
            setAssignmentDrafts(Object.fromEntries(rows.map((item) => [item.userId, { role: item.role, siteId: item.siteId || '', personnelRole: item.personnelRole || 'imam' }])));
          } catch { setAssignments([]); setAssignmentDrafts({}); }
        } else {
          setAssignments([]);
          setAssignmentDrafts({});
        }
"""
          if text.count(old) != 1:
              raise SystemExit(f'leadership load marker expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = """  const setUserAssignment = async (userId: string, roleValue: MosqueModuleRole, siteId?: string, personnelRole?: string) => {
    try {
"""
          new = """  const setUserAssignment = async (userId: string, roleValue: MosqueModuleRole, siteId?: string, personnelRole?: string) => {
    if (!isAdmin) {
      toast.error('إدارة أدوار مستخدمي المنصة متاحة لمسؤول النظام فقط');
      return;
    }
    try {
"""
          if text.count(old) != 1:
              raise SystemExit(f'assignment guard marker expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)

          replacements = [
            ("{role === 'head' && <TabsTrigger value=\"roles\">الأدوار التشغيلية</TabsTrigger>}", "{isAdmin && <TabsTrigger value=\"roles\">الأدوار التشغيلية</TabsTrigger>}"),
            ("{role === 'head' && <Field label=\"المشرف المسؤول عن الموقع\">", "{isAdmin && <Field label=\"المشرف المسؤول عن الموقع\">"),
            ("<Rule title=\"المنسوبون\" text=\"إدارة المشرفين ومنسوبي المساجد وربطهم بالمواقع.\" />", "<Rule title=\"منسوبو المساجد\" text=\"إدارة ومتابعة الإمام والمؤذن والخطيب والخطيب المتعاون فقط.\" />"),
          ]
          for old_value, new_value in replacements:
              count = text.count(old_value)
              if count != 1:
                  raise SystemExit(f'frontend marker expected once, found {count}: {old_value[:90]!r}')
              text = text.replace(old_value, new_value, 1)

          effect_marker = "  useEffect(() => { loadAll(); }, []);\n"
          effect_replacement = """  useEffect(() => { loadAll(); }, []);

  useEffect(() => {
    if (!isAdmin && activeTab === 'roles') setActiveTab('team');
  }, [isAdmin, activeTab]);
"""
          if text.count(effect_marker) != 1:
              raise SystemExit(f'active tab guard marker expected once, found {text.count(effect_marker)}')
          text = text.replace(effect_marker, effect_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend build
        run: npm run build

      - name: Commit verified frontend permission fix
        shell: bash
        run: |
          rm -f .github/workflows/apply-mosque-user-scope-20260818.yml
          git config user.name "OpenAI Project Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx .github/workflows/apply-mosque-user-scope-20260818.yml
          git commit -m "fix: limit mosque leadership user visibility"
          git push origin HEAD:main
