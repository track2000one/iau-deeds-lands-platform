name: Harden Central Building Migration Permissions

on:
  push:
    branches: [main]
    paths:
      - 'scripts/harden-central-building-migration-permissions.mjs'
      - '.github/workflows/harden-central-building-migration-permissions.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/harden-central-building-migration-permissions.mjs
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/CentralBuildingsRegistryPage.tsx
          git commit -m "Restrict building migration to editable modules"
          git push
