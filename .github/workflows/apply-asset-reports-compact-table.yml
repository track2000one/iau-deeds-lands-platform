name: Apply Asset Reports Compact Table

on:
  push:
    paths:
      - 'scripts/apply-asset-reports-compact-table.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/apply-asset-reports-compact-table.mjs
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AssetReportsPage.tsx
          git commit -m "Refine asset reports table layout"
          git push origin HEAD:main
