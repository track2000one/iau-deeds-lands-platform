name: Refine asset report print v3
on:
  push:
    paths:
      - 'scripts/refine-asset-report-print-v3.mjs'
      - '.github/workflows/refine-asset-report-print-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/refine-asset-report-print-v3.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AssetReportsPage.tsx
          git diff --cached --quiet || git commit -m "Refine asset report print proportions"
          git push
