name: Apply Saudi VAT Assets

on:
  push:
    paths:
      - 'scripts/enable-saudi-vat-assets.cjs'
      - 'scripts/trigger-saudi-vat-assets.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply Saudi VAT frontend patch
        run: node scripts/enable-saudi-vat-assets.cjs
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend build
        run: npm run build
      - name: Commit generated frontend changes
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/types/asset.ts src/app/api/assets.ts src/app/pages/AddAssetPage.tsx
          git commit -m "Add Saudi VAT calculation to asset entry"
          git push origin HEAD:main
