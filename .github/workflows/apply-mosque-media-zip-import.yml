name: Apply Mosque Media ZIP Import

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-mosque-media-zip-import.py'
      - '.github/workflows/apply-mosque-media-zip-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: python3 scripts/apply-mosque-media-zip-import.py
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/api/mosques.ts src/app/pages/MosquesUnitPage.tsx
          git commit -m "feat(mosques): add reviewed ZIP media import"
          git push
