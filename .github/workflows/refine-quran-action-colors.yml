name: Refine Quran Action Colors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refine-quran-action-colors.py'
      - '.github/workflows/refine-quran-action-colors.yml'

permissions:
  contents: write

concurrency:
  group: refine-quran-action-colors
  cancel-in-progress: true

jobs:
  apply-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply UI refinement
        run: python3 scripts/refine-quran-action-colors.py

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend build
        run: npm run build

      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "style(mosques): refine Quran action button colors"
          git push origin main
