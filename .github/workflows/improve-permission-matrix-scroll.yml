name: Improve permission matrix scroll

on:
  push:
    paths:
      - '.github/workflows/improve-permission-matrix-scroll.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Improve permissions dialog scrolling
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          matrix = 'src/app/components/PermissionMatrix.tsx'
          replace_once(
              matrix,
              "  disabled?: boolean;\n}> = ({ value, onChange, disabled = false }) => {",
              "  disabled?: boolean;\n  dialogMode?: boolean;\n}> = ({ value, onChange, disabled = false, dialogMode = false }) => {",
          )
          replace_once(
              matrix,
              '<Card className="overflow-hidden">',
              '<Card className={`overflow-hidden ${dialogMode ? \'min-h-0\' : \'\'}`}>',
          )
          replace_once(
              matrix,
              '<div className="border-b p-4">',
              '<div className={`border-b ${dialogMode ? \'p-3 sm:p-4\' : \'p-4\'}`}>',
          )
          replace_once(
              matrix,
              "              {ui('يمكن تمرير الجدول بعجلة الفأرة، سحب شريط التمرير، أو استخدام مفاتيح الأسهم بعد النقر داخل الجدول.', 'Scroll with the mouse wheel, drag the scrollbar, or use the arrow keys after focusing the table.')}\n",
              "              {ui('يمكن تمرير الجدول بعجلة الفأرة أو بسحب شريط التمرير الواضح على طرف الجدول، كما يمكن استخدام زري أعلى وأسفل للانتقال السريع.', 'Scroll with the mouse wheel or drag the visible scrollbar at the edge of the table. You can also use the Top and Bottom buttons for quick navigation.')}\n",
          )
          replace_once(
              matrix,
              '        className="max-h-[62vh] min-h-[320px] overflow-auto overscroll-contain outline-none [scrollbar-gutter:stable] focus:ring-2 focus:ring-primary/20"',
              "        className={`${dialogMode ? 'h-[clamp(300px,42dvh,480px)] min-h-[300px]' : 'max-h-[62vh] min-h-[320px]'} overflow-auto overscroll-contain scroll-smooth outline-none [scrollbar-gutter:stable_both-edges] [&::-webkit-scrollbar]:h-3 [&::-webkit-scrollbar]:w-3 [&::-webkit-scrollbar-track]:rounded-full [&::-webkit-scrollbar-track]:bg-slate-100 [&::-webkit-scrollbar-thumb]:rounded-full [&::-webkit-scrollbar-thumb]:bg-slate-400 focus:ring-2 focus:ring-primary/20`}",
          )

          admin = 'src/app/pages/AdminDashboardPage.tsx'
          replace_once(
              admin,
              '          className="flex max-h-[92dvh] w-[calc(100vw-1.5rem)] max-w-5xl flex-col gap-0 overflow-hidden p-0 sm:w-[calc(100vw-3rem)] sm:max-w-5xl"',
              '          className="flex max-h-[94dvh] w-[calc(100vw-1rem)] max-w-[min(96vw,1400px)] flex-col gap-0 overflow-hidden p-0 sm:w-[calc(100vw-2rem)]"',
          )
          replace_once(
              admin,
              '              حدّث الاسم والبريد والدور وحالة الحساب. ويمكنك التمرير داخل النافذة بعجلة الفأرة أو مفاتيح الأسهم.',
              '              حدّث الاسم والبريد والدور وحالة الحساب. جدول الصلاحيات مزود الآن بشريط تمرير أوضح وأسهل للسحب.',
          )
          replace_once(
              admin,
              '<div className="grid gap-4 py-2">',
              '<div className="grid gap-3 py-2 sm:grid-cols-2">',
          )
          replace_once(
              admin,
              '            <PermissionMatrix\n              value={editForm.permissions}',
              '            <PermissionMatrix\n              dialogMode\n              value={editForm.permissions}',
          )

      - name: Verify frontend
        run: |
          npm ci
          npm run build

      - name: Commit and clean helper
        run: |
          rm .github/workflows/improve-permission-matrix-scroll.yml
          git config user.name "OpenAI Project Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/components/PermissionMatrix.tsx src/app/pages/AdminDashboardPage.tsx .github/workflows/improve-permission-matrix-scroll.yml
          git commit -m "fix: improve permissions dialog scrolling"
          git push
