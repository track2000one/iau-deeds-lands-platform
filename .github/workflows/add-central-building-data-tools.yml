name: Add Central Building Data Tools

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add-central-building-data-tools.mjs'
      - 'src/app/components/CentralBuildingsReports.tsx'
      - '.github/workflows/add-central-building-data-tools.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/add-central-building-data-tools.mjs
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/CentralBuildingsRegistryPage.tsx src/app/components/BuildingExcelImportManager.tsx src/app/components/CentralBuildingsReports.tsx
          git commit -m "Add central building import template and reports"
          git push
