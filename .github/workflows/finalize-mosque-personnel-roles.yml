name: Finalize Mosque Personnel Roles
on:
  push:
    branches: [main]
    paths:
      - 'scripts/finalize-mosque-personnel-roles.cjs'
      - '.github/workflows/finalize-mosque-personnel-roles.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/finalize-mosque-personnel-roles.cjs
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx src/app/api/mosques.ts
          git commit -m "Show exact imam muezzin and khateeb roles in mosque unit"
          git restore --worktree .
          git pull --rebase origin main
          git push origin main
