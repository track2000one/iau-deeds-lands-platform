name: Apply Mosques Excel Reports

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mosques-excel-reports.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply Excel report updates
        run: python3 scripts/apply-mosques-excel-reports.py
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Remove temporary patch files
        run: rm -f scripts/apply-mosques-excel-reports.py .github/workflows/apply-mosques-excel-reports.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx src/app/components/MosqueFieldVisitsPanel.tsx src/app/utils/excelReport.ts scripts/apply-mosques-excel-reports.py .github/workflows/apply-mosques-excel-reports.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add Excel exports to mosque unit reports"
            git push origin main
          fi
