name: Apply Asset Record Card Redesign

on:
  push:
    paths:
      - 'scripts/redesign-asset-record-cards.cjs'

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply asset card redesign
        run: node scripts/redesign-asset-record-cards.cjs
      - name: Install dependencies
        run: npm ci
      - name: Verify frontend build
        run: npm run build
      - name: Commit redesigned card
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AssetsPage.tsx
          git commit -m "Redesign asset record cards"
          git push origin HEAD:main
