name: Apply Mobile Asset Capture

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-mobile-asset-capture.mjs'
      - '.github/workflows/apply-mobile-asset-capture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/apply-mobile-asset-capture.mjs
      - run: npm run build
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AddAssetPage.tsx
          git commit -m "Add mobile barcode scanner and camera capture"
          git push
