name: Apply Deployment Fingerprint UI

on:
  push:
    branches: [feat/deployment-fingerprint-ui]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deployment-fingerprint-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/deployment-fingerprint-ui
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply deployment fingerprint UI
        run: node scripts/apply-deployment-fingerprint-ui.mjs
      - name: Build frontend
        run: npm run build
      - name: Verify integration markers
        run: |
          grep -q "AccountingBackendDeploymentStatus" src/app/pages/AccountingPropertyEvidenceAuditPage.tsx
          grep -q "backendAuditReady" src/app/pages/AccountingPropertyEvidenceAuditPage.tsx
          grep -q "accounting_evidence_audit_reconciliation_v1" src/app/api/systemHealth.ts
      - name: Remove temporary automation files
        run: |
          rm scripts/apply-deployment-fingerprint-ui.mjs
          rm .github/workflows/apply-deployment-fingerprint-ui.yml
      - name: Commit integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Integrate deployment fingerprint readiness UI"
            git push origin HEAD:feat/deployment-fingerprint-ui
          fi
