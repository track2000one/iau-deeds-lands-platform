name: Apply Accounting Evidence User Audit

on:
  push:
    branches:
      - feat/accounting-evidence-user-audit
    paths:
      - scripts/apply-accounting-evidence-user-audit.py
      - .github/workflows/apply-accounting-evidence-user-audit.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/accounting-evidence-user-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: python3 scripts/apply-accounting-evidence-user-audit.py
      - run: npm run build
      - name: Remove temporary automation files
        run: rm -f scripts/apply-accounting-evidence-user-audit.py .github/workflows/apply-accounting-evidence-user-audit.yml
      - name: Commit integration changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/AccountingPropertyControlIndicatorsPage.tsx docs/accounting-evidence-user-audit.md scripts/apply-accounting-evidence-user-audit.py .github/workflows/apply-accounting-evidence-user-audit.yml
          git diff --cached --quiet || git commit -m "ربط سجل الإثبات بهوية المستخدم والصلاحيات"
          git push origin HEAD:feat/accounting-evidence-user-audit
