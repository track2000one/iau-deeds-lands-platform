name: Apply Mosque Print Table Layout

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-mosque-print-table-layout.py'
      - '.github/workflows/apply-mosque-print-table-layout.yml'

permissions:
  contents: write

concurrency:
  group: apply-mosque-print-table-layout
  cancel-in-progress: true

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply layout patch
        run: python3 scripts/apply-mosque-print-table-layout.py

      - name: Install dependencies
        run: npm ci

      - name: Verify frontend build
        run: npm run build

      - name: Commit verified source change
        run: |
          if git diff --quiet -- src/app/pages/MosquesUnitPage.tsx; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/pages/MosquesUnitPage.tsx
          git commit -m "fix(mosques): compact A4 print table layout"
          git push origin HEAD:main
