<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">أيقونة مكتبة المصاحف</title>
  <desc id="desc">مصحف أزرق مزخرف بالذهب على خلفية زمردية ثلاثية الأبعاد مع إضاءة.</desc>
  <defs>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f8a67"/>
      <stop offset="0.42" stop-color="#04664f"/>
      <stop offset="1" stop-color="#013d36"/>
    </linearGradient>
    <linearGradient id="emeraldGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".32" stop-color="#d6fff0" stop-opacity=".08"/>
      <stop offset="1" stop-color="#001f1a" stop-opacity=".3"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff2a1"/>
      <stop offset=".22" stop-color="#ffd95f"/>
      <stop offset=".52" stop-color="#b97710"/>
      <stop offset=".76" stop-color="#ffe889"/>
      <stop offset="1" stop-color="#925406"/>
    </linearGradient>
    <linearGradient id="goldPages" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff1a6"/>
      <stop offset=".45" stop-color="#dca52a"/>
      <stop offset="1" stop-color="#8b4d06"/>
    </linearGradient>
    <linearGradient id="bookBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#174e85"/>
      <stop offset=".42" stop-color="#0d3264"/>
      <stop offset="1" stop-color="#061d43"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#fff79a" stop-opacity=".92"/>
      <stop offset=".33" stop-color="#e9d74d" stop-opacity=".5"/>
      <stop offset="1" stop-color="#d6c844" stop-opacity="0"/>
    </radialGradient>
    <filter id="outerShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#032b24" flood-opacity=".42"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#f7c948" flood-opacity=".28"/>
    </filter>
    <filter id="bookShadow" x="-40%" y="-40%" width="180%" height="190%">
      <feDropShadow dx="2" dy="9" stdDeviation="5" flood-color="#001b29" flood-opacity=".66"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <pattern id="geom" width="30" height="30" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M15 1 29 15 15 29 1 15Z" fill="none" stroke="#b9d98c" stroke-opacity=".1" stroke-width="1.4"/>
      <circle cx="15" cy="15" r="4" fill="none" stroke="#f6da63" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <g filter="url(#outerShadow)">
    <rect x="8" y="8" width="176" height="176" rx="40" fill="url(#emerald)" stroke="url(#gold)" stroke-width="7"/>
    <rect x="15" y="15" width="162" height="162" rx="34" fill="url(#geom)" opacity=".9"/>
    <rect x="15" y="15" width="162" height="162" rx="34" fill="url(#emeraldGlass)"/>
    <path d="M19 56C31 25 60 18 95 18c36 0 65 7 78 38-23-12-49-18-78-18-28 0-54 6-76 18Z" fill="#fff" opacity=".16"/>
  </g>

  <ellipse cx="96" cy="95" rx="67" ry="66" fill="url(#halo)" opacity=".72"/>
  <path d="M96 34c8 15 19 17 31 16 0 12 9 18 20 22-9 10-11 19-8 31-14 1-25 7-32 18-8-9-16-14-27-16-1-12-6-21-16-28 8-9 11-18 9-29 10 0 17-5 23-14Z" fill="none" stroke="#d8d46a" stroke-opacity=".34" stroke-width="3"/>

  <g transform="rotate(-7 98 101)" filter="url(#bookShadow)">
    <rect x="55" y="55" width="98" height="111" rx="10" fill="#06172f" stroke="#02101f" stroke-width="3"/>
    <rect x="50" y="48" width="95" height="111" rx="10" fill="url(#bookBlue)" stroke="url(#gold)" stroke-width="4"/>
    <rect x="54" y="52" width="87" height="103" rx="8" fill="none" stroke="#ffdf65" stroke-width="1.7"/>
    <rect x="58" y="56" width="79" height="95" rx="6" fill="none" stroke="#c79023" stroke-width="1" opacity=".9"/>

    <path d="M62 64h18l7-7 7 7h27l7-7 7 7" fill="none" stroke="#f7d66a" stroke-width="1.2" opacity=".85"/>
    <path d="M62 143h18l7 7 7-7h27l7 7 7-7" fill="none" stroke="#f7d66a" stroke-width="1.2" opacity=".85"/>
    <path d="M62 61v14l-6 7 6 7v28l-6 7 6 7v13M135 61v14l6 7-6 7v28l6 7-6 7v13" fill="none" stroke="#d8aa36" stroke-width="1" opacity=".7"/>

    <path d="M97 68c10 0 17 6 21 14 8 4 12 12 11 21 1 9-4 17-11 22-4 8-11 13-21 13-9 0-17-5-21-13-7-5-11-13-10-22-1-9 3-17 10-21 4-8 12-14 21-14Z" fill="#08295a" stroke="url(#gold)" stroke-width="3"/>
    <path d="M97 73c7 0 13 4 17 10 6 3 9 10 8 17 1 7-2 14-8 18-4 6-10 10-17 10-8 0-14-4-18-10-5-4-8-11-7-18-1-7 2-14 7-17 4-6 10-10 18-10Z" fill="none" stroke="#d4a332" stroke-width="1.2" opacity=".9"/>

    <text x="97" y="98" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Tahoma, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffe982">القرآن</text>
    <text x="97" y="115" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" font-family="Tahoma, Arial, sans-serif" font-size="12" font-weight="700" fill="#ffe982">الكريم</text>

    <path d="M69 69l7 3-7 3-3 7-3-7-7-3 7-3 3-7 3 7Zm57 0 7 3-7 3-3 7-3-7-7-3 7-3 3-7 3 7ZM69 136l7 3-7 3-3 7-3-7-7-3 7-3 3-7 3 7Zm57 0 7 3-7 3-3 7-3-7-7-3 7-3 3-7 3 7Z" fill="#f0c64c" opacity=".92"/>

    <path d="M145 60h8v93h-8Z" fill="#041b3b"/>
    <path d="M147 69h5M147 78h5M147 129h5M147 138h5" stroke="#e6b23b" stroke-width="2"/>
    <rect x="58" y="156" width="84" height="8" rx="3" fill="url(#goldPages)"/>
    <path d="M82 160v24l8-7 8 7v-24Z" fill="url(#gold)" stroke="#9f620c" stroke-width="1"/>
  </g>

  <g fill="#fff7a5">
    <circle cx="39" cy="46" r="2.2"/>
    <circle cx="153" cy="55" r="1.7"/>
    <circle cx="153" cy="126" r="2"/>
    <circle cx="42" cy="132" r="1.6"/>
  </g>
  <g fill="#fff" opacity=".9" filter="url(#softGlow)">
    <circle cx="39" cy="46" r="3"/>
    <circle cx="153" cy="126" r="2.5"/>
  </g>
</svg>
